<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>بازی من، زمین من، قوانین من</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0F1417; --surface:#171E24; --surface2:#1D262C; --border:#2A343B;
  --text:#E8E6DE; --text-dim:#9AA3A8; --text-faint:#6B767C;
  --gold:#C9A227; --gold-dim:#8F7420;
  --green:#3F9C6D; --green-dim:#2C6E4C;
  --red:#C0533B; --red-dim:#8A3B29;
  --blue:#4A7FA6;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface2:#F7F5F0; --border:#DEDAD0;
  --text:#20241F; --text-dim:#5B5F58; --text-faint:#8A8E86;
  --shadow:0 8px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Vazirmatn', sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden; transition:background .2s,color .2s;
}
body[dir="ltr"]{font-family:'Vazirmatn', sans-serif;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

/* LAYOUT */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:230px; background:var(--surface); border-inline-end:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 14px; flex-shrink:0;
  position:sticky; top:0; height:100vh;
}
#sidebar .brand{padding:10px 8px 22px; }
#sidebar .brand .t1{font-size:13px; color:var(--gold); font-weight:600; letter-spacing:.3px;}
#sidebar .brand .t2{font-size:19px; font-weight:800; margin-top:4px; line-height:1.5;}
#sidebar nav{display:flex; flex-direction:column; gap:4px; flex:1;}
.navitem{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-md);
  color:var(--text-dim); font-size:14.5px; font-weight:600; border:1px solid transparent;
}
.navitem:hover{background:var(--surface2);}
.navitem.active{background:var(--surface2); color:var(--gold); border-color:var(--border);}
.navitem .ic{width:20px; text-align:center; font-size:16px;}
#sidebar .sidefoot{font-size:11.5px; color:var(--text-faint); padding:10px 8px;}

#main-col{flex:1; min-width:0; display:flex; flex-direction:column;}

/* HEADER */
#topheader{
  position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
#topheader .dateblock{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
#topheader .dchip{font-size:12.5px; color:var(--text-dim); background:var(--surface2); border:1px solid var(--border); padding:6px 10px; border-radius:999px; display:flex; gap:6px; align-items:center;}
#topheader .clock{font-weight:800; font-size:16px; color:var(--gold); font-variant-numeric: tabular-nums;}
#topheader .statusblock{display:flex; align-items:center; gap:12px;}
.ministat{text-align:center;}
.ministat .v{font-weight:800; font-size:15px;}
.ministat .l{font-size:10.5px; color:var(--text-faint);}
#themeToggle{background:var(--surface2); border:1px solid var(--border); border-radius:999px; padding:7px 12px; font-size:13px; color:var(--text);}

main{flex:1; padding:18px 20px 90px; max-width:1400px; width:100%; margin:0 auto;}
@media(min-width:900px){ main{padding:22px 30px 40px;} }

/* CARDS */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow);}
.card + .card{margin-top:14px;}
.grid{display:grid; gap:14px;}
.grid.cols-2{grid-template-columns:1fr; }
.grid.cols-3{grid-template-columns:1fr;}
.grid.cols-4{grid-template-columns:repeat(2,1fr);}
@media(min-width:700px){
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
}
.summary-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px;}
.summary-card .sv{font-size:22px; font-weight:800;}
.summary-card .sl{font-size:12px; color:var(--text-dim); margin-top:4px;}
.summary-card .sicon{font-size:18px; opacity:.7; margin-bottom:6px;}

h1.pagetitle{font-size:20px; font-weight:800; margin-bottom:4px;}
.pagesub{font-size:13px; color:var(--text-dim); margin-bottom:16px;}
.sectiontitle{font-size:15px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}

/* BUTTONS */
.btn{display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13.5px; font-weight:600;}
.btn:hover{border-color:var(--gold);}
.btn.primary{background:var(--gold); border-color:var(--gold); color:#141414;}
.btn.danger{background:transparent; border-color:var(--red-dim); color:var(--red);}
.btn.ghost{background:transparent;}
.btn.sm{padding:5px 9px; font-size:12px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

/* TABS/FILTER */
.tabbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;}
.tabbtn{white-space:nowrap; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:13px; color:var(--text-dim); font-weight:600;}
.tabbtn.active{background:var(--gold); color:#141414; border-color:var(--gold);}
.filterrow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filterrow select, .filterrow input[type=text]{background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:var(--radius-sm); font-size:13px;}

/* LIST ITEMS */
.item-row{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:10px;}
.item-row .irow-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.item-row .ititle{font-weight:700; font-size:14.5px;}
.item-row .idesc{font-size:12.5px; color:var(--text-dim); margin-top:4px;}
.item-row .imeta{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.badge{font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text-dim);}
.badge.gold{color:var(--gold); border-color:var(--gold-dim);}
.badge.green{color:var(--green); border-color:var(--green-dim);}
.badge.red{color:var(--red); border-color:var(--red-dim);}
.item-actions{display:flex; gap:6px;}
.chk-progress{height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-top:8px;}
.chk-progress > div{height:100%; background:var(--green);}

.checklist-mini{margin-top:10px; border-top:1px dashed var(--border); padding-top:8px;}
.cl-item{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13px;}
.cl-item input[type=checkbox]{width:16px; height:16px; accent-color:var(--green);}
.cl-item.done .cltext{text-decoration:line-through; color:var(--text-faint);}
.cl-item .cltext{flex:1;}

/* MODAL */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
@media(min-width:700px){ .overlay{align-items:center;} }
.modal{background:var(--surface); border:1px solid var(--border); border-radius:16px 16px 0 0; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:20px; box-shadow:var(--shadow);}
@media(min-width:700px){ .modal{border-radius:16px;} }
.modal h3{font-size:16px; font-weight:800; margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
.field input, .field select, .field textarea{width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:var(--radius-sm); font-size:14px;}
.field textarea{min-height:70px; resize:vertical;}
.modal .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}
.field-row{display:flex; gap:10px;}
.field-row > .field{flex:1;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--gold-dim); color:var(--text); padding:10px 18px; border-radius:999px; font-size:13px; z-index:200; box-shadow:var(--shadow); font-weight:600;}
@media(min-width:900px){ .toast{bottom:24px;} }

.empty-state{text-align:center; padding:40px 20px; color:var(--text-faint);}
.empty-state .eicon{font-size:32px; margin-bottom:10px;}

/* BOTTOM NAV */
#bottomnav{
  position:fixed; bottom:0; inset-inline:0; background:var(--surface); border-top:1px solid var(--border);
  display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:30;
}
#bottomnav .bnitem{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; color:var(--text-faint); font-size:10.5px; font-weight:600;}
#bottomnav .bnitem.active{color:var(--gold);}
#bottomnav .bnitem .ic{font-size:19px;}

@media(min-width:900px){ #sidebar{display:flex;} #bottomnav{display:none;} }
@media(max-width:899px){ #sidebar{display:none;} main{padding-bottom:80px;} }

.chart-wrap{position:relative; height:220px;}
.progressbar-lg{height:16px; background:var(--border); border-radius:999px; overflow:hidden; margin:10px 0;}
.progressbar-lg > div{height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold));}

.rule-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
.rule-row .rn{width:22px; height:22px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--gold); flex-shrink:0;}

.quiz-opt{display:block; width:100%; text-align:start; padding:12px 14px; border:1px solid var(--border); background:var(--surface2); border-radius:var(--radius-md); margin-bottom:9px; font-size:14px;}
.quiz-opt.selected{border-color:var(--gold); background:rgba(201,162,39,.12);}
.quiz-opt.correct{border-color:var(--green); background:rgba(63,156,109,.14);}
.quiz-opt.wrong{border-color:var(--red); background:rgba(192,83,59,.14);}

.streakflame{color:var(--gold); font-weight:800;}
.gj-entry{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px; margin-bottom:8px;}
.gj-entry .gdate{font-size:11px; color:var(--text-faint);}

.lang-pick{display:flex; gap:8px; flex-wrap:wrap;}
.lang-pick button{flex:1; min-width:90px;}

.dailymission-item{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border);}
.dailymission-item:last-child{border-bottom:none;}
.dailymission-item .dmic{font-size:17px; width:24px; text-align:center;}
.dailymission-item .dmlabel{flex:1; font-size:13.5px; font-weight:600;}

.avatar-circle{width:56px; height:56px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color:var(--gold);}
.hrline{border:none; border-top:1px solid var(--border); margin:14px 0;}
.smallnote{font-size:11.5px; color:var(--text-faint); line-height:1.7; margin-top:6px;}
.kpi-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.kpi-row .kpi{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:12px; flex:1; min-width:100px; text-align:center;}
.kpi-row .kpi b{display:block; font-size:16px; margin-top:2px;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">

      <div class="statusblock" id="statusblock"></div>

  </div>
</div>
<nav id="bottomnav"></nav>
<div id="modalRoot"></div>

/* ============ DATE UTILS ============ */
function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy;
  gy = gm > 2 ? gy + 1 : gy;
  let days = 355666 + (365 * gy) + Math.floor((gy + 8) / 4) - Math.floor((gy + 99) / 100) + Math.floor((gy + 399) / 400) + gd + g_d_m[gm - 1];
  jy = -1595 + (33 * Math.floor(days / 12053));
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let jm, jd;
  if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
  else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
  return [jy, jm, jd];
}
const JMONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const GMONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function faDigits(str){ const fa=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹']; return String(str).replace(/[0-9]/g,d=>fa[d]); }
function arDigits(str){ const ar=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; return String(str).replace(/[0-9]/g,d=>ar[d]); }
function formatJalali(date){
  const [jy,jm,jd]=toJalali(date.getFullYear(), date.getMonth()+1, date.getDate());
  const s = `${jd} ${JMONTHS[jm-1]} ${jy}`;
  return STATE.lang==='fa'? faDigits(s): s;
}
function formatGregorian(date){
  if(STATE.lang==='en') return `${GMONTHS_EN[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
  const s = `${date.getDate()} ${GMONTHS_EN[date.getMonth()]} ${date.getFullYear()}`;
  return STATE.lang==='ar'? arDigits(s): faDigits(s);
}
function weekdayName(date){
  const idx=date.getDay();
  return t('weekday_'+idx);
}
function localizeNum(n){
  n = Math.round(n*10)/10;
  if(STATE.lang==='fa') return faDigits(n);
  if(STATE.lang==='ar') return arDigits(n);
  return String(n);
}
function fmtClock(date){
  const h=String(date.getHours()).padStart(2,'0'), m=String(date.getMinutes()).padStart(2,'0'), s=String(date.getSeconds()).padStart(2,'0');
  const str = `${h}:${m}:${s}`;
  return STATE.lang==='fa'?faDigits(str):(STATE.lang==='ar'?arDigits(str):str);
}
function startOfWeek(d){ const dt=new Date(d); const day=dt.getDay(); dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; }
function isSameDay(d1,d2){ return d1.toDateString()===d2.toDateString(); }
function isThisWeek(dateStr){ if(!dateStr) return false; const d=new Date(dateStr); const now=new Date(); const sw=startOfWeek(now); const ew=new Date(sw); ew.setDate(ew.getDate()+7); return d>=sw && d<ew; }
function isThisMonth(dateStr){ if(!dateStr) return false; const d=new Date(dateStr); const now=new Date(); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); }
function isToday(dateStr){ if(!dateStr) return false; return isSameDay(new Date(dateStr), new Date()); }
function isTomorrow(dateStr){ if(!dateStr) return false; const now=new Date(); now.setDate(now.getDate()+1); return isSameDay(new Date(dateStr), now); }
function isOverdue(dateStr, done){ if(!dateStr || done) return false; return new Date(dateStr) < new Date(new Date().toDateString()); }

/* ============ SCORE HELPERS ============ */
function checklistProgress(list){
  if(!list || !list.length) return 0;
  const done = list.filter(i=>i.done).length;
  return Math.round((done/list.length)*100);
}
function weightedPerf(items, getChecklist){
  // Performance Score = completed weighted tasks / total weighted tasks * 100
  let totalW=0, doneW=0;
  items.forEach(it=>{
    const cl = getChecklist(it) || [];
    cl.forEach(c=>{
      const w = c.score||1;
      totalW+=w;
      if(c.done) doneW+=w;
    });
  });
  if(totalW===0) return 0;
  return Math.round((doneW/totalW)*100);
}
function allChecklistItems(){
  let all=[];
  STATE.challenges.forEach(c=> (c.checklist||[]).forEach(i=>all.push({...i, _date:c.followUpDate||c.createdDate})));
  STATE.opportunities.forEach(c=> (c.checklist||[]).forEach(i=>all.push({...i, _date:c.date})));
  STATE.threats.forEach(c=> (c.checklist||[]).forEach(i=>all.push({...i, _date:c.date})));
  STATE.development.forEach(c=> (c.checklist||[]).forEach(i=>all.push({...i, _date:c.date})));
  STATE.goals.forEach(g=> (g.lists||[]).forEach(l=> (l.checklist||[]).forEach(i=>all.push({...i, _date:i.date||g.deadline}))));
  return all;
}
function overallPerformanceScore(filterFn){
  const items = allChecklistItems().filter(i=> filterFn? filterFn(i): true);
  if(!items.length) return 0;
  let totalW=0, doneW=0;
  items.forEach(c=>{ const w=c.score||1; totalW+=w; if(c.done) doneW+=w; });
  return totalW? Math.round((doneW/totalW)*100):0;
}
function todayPerf(){ return overallPerformanceScore(i=> i._date && isToday(i._date)) || overallPerformanceScore(null); }
function weekPerf(){ return overallPerformanceScore(i=> i._date && isThisWeek(i._date)) || overallPerformanceScore(null); }
function monthPerf(){ return overallPerformanceScore(i=> i._date && isThisMonth(i._date)) || overallPerformanceScore(null); }
function goalsProgressPct(){
  if(!STATE.goals.length) return 0;
  const pcts = STATE.goals.map(g=>goalProgress(g));
  return Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
}
function goalProgress(goal){
  let all=[];
  (goal.lists||[]).forEach(l=> all=all.concat(l.checklist||[]));
  if(!all.length) return 0;
  return checklistProgress(all);
}
function oppScore(o){
  const p=(Number(o.probability)||0)/100;
  return Math.round((p*(Number(o.benefit)||0)) - (Number(o.cost)||0) - (Number(o.risk)||0));
}
function riskScore(th){
  const p=(Number(th.probability)||0)/100;
  return Math.round(p*(Number(th.impact)||0));
}
function riskLevelFromScore(s){
  if(s>=75) return 'critical'; if(s>=50) return 'high'; if(s>=25) return 'medium'; return 'low';
}
function countActive(arr){ return arr.filter(x=>x.status!=='done' && x.status!=='canceled').length; }
function countTasksDone(){
  return allChecklistItems().filter(i=>i.done).length;
}
function lastQuizScore(){
  if(!STATE.quizResults.length) return 0;
  return STATE.quizResults[STATE.quizResults.length-1].scorePct;
}
function overallSystemScore(){
  const parts = [todayPerf(), goalsProgressPct(), lastQuizScore()];
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function gratitudeStreak(){
  if(!STATE.gratitude.length) return 0;
  const dates = [...new Set(STATE.gratitude.map(g=>g.date))].sort().reverse();
  let streak=0; let cur=new Date();
  for(let i=0;i<dates.length;i++){
    const d=new Date(dates[i]);
    const diff = Math.round((new Date(cur.toDateString())-new Date(d.toDateString()))/86400000);
    if(diff===0 || diff===1){ streak++; cur=d; } else break;
  }
  return streak;
}
function scoreLabel(pct){
  if(pct<=20) return t('need_review');
  if(pct<=40) return t('weak');
  if(pct<=60) return t('mediumres');
  if(pct<=80) return t('good');
  if(pct<=90) return t('vgood');
  return t('excellent');
}

/* ============ MODAL SYSTEM ============ */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="ovl"><div class="modal">${html}</div></div>`;
  document.getElementById('ovl').addEventListener('click', (e)=>{ if(e.target.id==='ovl') closeModal(); });
}
function confirmDelete(onYes){
  openModal(`
    <h3>${t('delete_confirm')}</h3>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn danger" id="confirmDelBtn">${t('yes_delete')}</button>
    </div>`);
  document.getElementById('confirmDelBtn').onclick = ()=>{ onYes(); closeModal(); };
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* Generic mini checklist renderer used inside challenge/opp/threat/dev/goal items.
   scope: 'perf' (uses PERF_TAB + itemId) or 'goal' (uses goalId+listId) */
function renderMiniChecklist(containerId, list, scope, ids){
  const pct = checklistProgress(list);
  let toggleCall, addCall, deleteCallPrefix;
  if(scope==='perf'){
    toggleCall = (clId)=>`toggleChecklistItem('${ids.itemId}','${clId}')`;
    addCall = `addChecklistItem('${ids.itemId}','${containerId}')`;
    deleteCallPrefix = (clId)=>`deleteChecklistItem('${ids.itemId}','${clId}')`;
  } else {
    toggleCall = (clId)=>`toggleGoalChecklistItem('${ids.goalId}','${ids.listId}','${clId}')`;
    addCall = `addGoalChecklistItem('${ids.goalId}','${ids.listId}','${containerId}')`;
    deleteCallPrefix = (clId)=>`deleteGoalChecklistItem('${ids.goalId}','${ids.listId}','${clId}')`;
  }
  let html = `<div class="checklist-mini">`;
  (list||[]).forEach(item=>{
    html += `<div class="cl-item ${item.done?'done':''}">
      <input type="checkbox" ${item.done?'checked':''} onchange="${toggleCall(item.id)}">
      <span class="cltext">${esc(item.title)}</span>
      <span class="badge">${item.score||1}</span>
      <button class="btn sm ghost" onclick="${deleteCallPrefix(item.id)}">✕</button>
    </div>`;
  });
  html += `<div class="chk-progress"><div style="width:${pct}%"></div></div>`;
  html += `<div style="display:flex; gap:6px; margin-top:8px;">
      <input type="text" id="${containerId}_newitem" placeholder="${t('add_item')}" style="flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:7px 9px; border-radius:6px; font-size:12.5px;">
      <button class="btn sm" onclick="${addCall}">+</button>
    </div>`;
  html += `</div>`;
  return html;
}

function statusBadgeClass(status){
  if(status==='done') return 'green';
  if(status==='canceled') return 'red';
  return '';
}
function statusLabel(status){
  const map = {done:t('done'), inprogress:t('inprogress'), notdone:t('notdone'), canceled:t('canceled')};
  return map[status] || status;
}
function levelBadgeClass(lvl){
  if(lvl==='critical'||lvl==='high') return 'red';
  if(lvl==='medium') return 'gold';
  return 'green';
}
function levelLabel(lvl){
  return t(lvl) || lvl;
}

  `;

function setPerfTab(tb){ PERF_TAB=tb; PERF_FILTER='all'; PERF_SEARCH=''; renderPage(); }
function matchesFilter(dateVal, status){
  const done = status==='done';
  switch(PERF_FILTER){
    case 'today': return isToday(dateVal);
    case 'tomorrow': return isTomorrow(dateVal);
    case 'week': return isThisWeek(dateVal);
    case 'month': return isThisMonth(dateVal);
    case 'overdue': return isOverdue(dateVal, done);
    case 'done': return done;
    case 'notdone': return !done;
    default: return true;
  }
}
function matchesSearch(obj){
  if(!PERF_SEARCH) return true;
  const s = PERF_SEARCH.toLowerCase();
  return (obj.title||'').toLowerCase().includes(s) || (obj.description||'').toLowerCase().includes(s);
}
function renderPerfList(){
  const arr = STATE[PERF_TAB];
  const filtered = arr.filter(o=> matchesFilter(o.date||o.followUpDate||o.createdDate, o.status) && matchesSearch(o));
  if(!filtered.length) return `<div class="empty-state"><div class="eicon">🗂️</div>${t('empty_generic')}</div>`;
  return filtered.map(o=>renderPerfItem(o)).join('');
}
function renderPerfItem(o){

  let scoreLine='';
  if(PERF_TAB==='opportunities'){
    scoreLine = `<span class="badge gold">${t('opp_score')}: ${localizeNum(oppScore(o))}</span>`;
  } else if(PERF_TAB==='threats'){
    const rs = riskScore(o);
    scoreLine = `<span class="badge ${levelBadgeClass(riskLevelFromScore(rs))}">${t('risk_score')}: ${localizeNum(rs)} (${levelLabel(riskLevelFromScore(rs))})</span>`;
  } else {
    scoreLine = `<span class="badge">${t('score_f')}: ${localizeNum(o.score||0)}</span>`;
  }
  const dateStr = o.date||o.followUpDate||o.createdDate||'';
  return `
  <div class="item-row">
    <div class="irow-top">
      <div>
        <div class="ititle">${esc(o.title)}</div>
        ${o.description?`<div class="idesc">${esc(o.description)}</div>`:''}

        <button class="btn sm ghost" onclick="duplicateItem('${PERF_TAB}','${o.id}')">⧉</button>

function findPerfItem(id){ return STATE[PERF_TAB].find(x=>x.id===id); }
function toggleChecklistItem(itemId, clId){
  const o = findPerfItem(itemId); if(!o) return;
  const c = (o.checklist||[]).find(x=>x.id===clId); if(!c) return;
  c.done = !c.done;
  updateParentStatusFromChecklist(o);
  saveState(); renderPage(); renderHeader();
}
function updateParentStatusFromChecklist(o){
  if(!o.checklist || !o.checklist.length) return;
  const pct = checklistProgress(o.checklist);
  if(pct===100) o.status='done';
  else if(pct>0) o.status='inprogress';
}
function addChecklistItem(itemId, containerId){
  const o = findPerfItem(itemId); if(!o) return;
  const input = document.getElementById(containerId+'_newitem');
  const val = input.value.trim();
  if(!val) return;
  if(!o.checklist) o.checklist=[];
  o.checklist.push({id:uid(), title:val, done:false, score:5});
  saveState(); renderPage(); renderHeader();
}
function deleteChecklistItem(itemId, clId){
  const o = findPerfItem(itemId); if(!o) return;
  o.checklist = (o.checklist||[]).filter(x=>x.id!==clId);
  updateParentStatusFromChecklist(o);
  saveState(); renderPage(); renderHeader();
}
function deletePerfItem(id){
  confirmDelete(()=>{
    STATE[PERF_TAB] = STATE[PERF_TAB].filter(x=>x.id!==id);
    saveState(); showToast(t('deleted')); renderPage(); renderHeader();
  });
}
function duplicateItem(tab, id){
  const o = STATE[tab].find(x=>x.id===id); if(!o) return;
  const copy = JSON.parse(JSON.stringify(o));
  copy.id = uid();
  copy.title = copy.title + ' (copy)';
  if(copy.checklist) copy.checklist = copy.checklist.map(c=>({...c, id:uid()}));
  STATE[tab].push(copy);
  saveState(); showToast(t('save_success')); renderPage();
}

let QUIZ_SESSION = null; // {questions:[], index:0, answers:[], selected:null}

function pageQuiz(){
  if(QUIZ_SESSION && !QUIZ_SESSION.finished) return renderQuizQuestion();
  if(QUIZ_SESSION && QUIZ_SESSION.finished) return renderQuizResult(QUIZ_SESSION.result);
  return `

    </div>
    <button class="btn primary" style="margin-top:16px;" onclick="startQuiz()">${t('start_quiz')} (100)</button>

      <div class="idesc">${scoreLabel(r.scorePct)}</div></div>`).join('')}
  </div>`:''}
  `;
}
function startQuiz(){
  const shuffled = QUIZ_BANK.slice().sort(()=>Math.random()-0.5);
  QUIZ_SESSION = {questions:shuffled, index:0, answers:[], finished:false, selected:null};
  renderPage();
}
function renderQuizQuestion(){
  const q = QUIZ_SESSION.questions[QUIZ_SESSION.index];
  const sel = QUIZ_SESSION.selected;
  return `
  <h1 class="pagetitle">${t('quiz_title')}</h1>
  <div class="pagesub">${t('quiz_progress')} ${localizeNum(QUIZ_SESSION.index+1)} ${t('of_word')} ${localizeNum(QUIZ_SESSION.questions.length)} — ${CAT_LABELS[q.category][STATE.lang]||CAT_LABELS[q.category].fa}</div>
  <div class="progressbar-lg"><div style="width:${(QUIZ_SESSION.index/QUIZ_SESSION.questions.length)*100}%"></div></div>
  <div class="card">
    <div style="font-weight:700; font-size:15.5px; margin-bottom:14px; line-height:1.8;">${esc(q.question)}</div>
    ${q.options.map((opt,i)=>{
      let cls='quiz-opt';
      if(sel!==null){
        if(i===q.correct) cls+=' correct';
        else if(i===sel && sel!==q.correct) cls+=' wrong';
      }
      return `<button class="${cls}" ${sel!==null?'disabled':''} onclick="selectQuizAnswer(${i})">${esc(opt)}</button>`;
    }).join('')}
    ${sel!==null? `<div class="smallnote" style="margin-top:10px; font-size:12.5px;">${esc(q.explanation)}</div>
      <button class="btn primary" style="margin-top:14px;" onclick="nextQuizQuestion()">${QUIZ_SESSION.index+1>=QUIZ_SESSION.questions.length? t('finish'): t('next')}</button>` : ''}
  </div>`;
}
function selectQuizAnswer(i){
  if(QUIZ_SESSION.selected!==null) return;
  QUIZ_SESSION.selected = i;
  const q = QUIZ_SESSION.questions[QUIZ_SESSION.index];
  QUIZ_SESSION.answers.push({category:q.category, correct: i===q.correct});
  renderPage();
}
function nextQuizQuestion(){
  QUIZ_SESSION.index++;
  QUIZ_SESSION.selected=null;
  if(QUIZ_SESSION.index>=QUIZ_SESSION.questions.length){
    finishQuiz();
  } else {
    renderPage();
  }
}
function finishQuiz(){
  const answers = QUIZ_SESSION.answers;
  const totalCorrect = answers.filter(a=>a.correct).length;
  const scorePct = Math.round((totalCorrect/answers.length)*100);
  const byCat = {};
  CATS.forEach(c=>{
    const catAnswers = answers.filter(a=>a.category===c);
    byCat[c] = catAnswers.length? Math.round((catAnswers.filter(a=>a.correct).length/catAnswers.length)*100) : null;
  });
  let weakCat = null, weakVal = 101;
  Object.keys(byCat).forEach(c=>{ if(byCat[c]!==null && byCat[c]<weakVal){ weakVal=byCat[c]; weakCat=c; } });
  const result = {scorePct, byCat, weakCat, weakVal, date:todayISO()};
  STATE.quizResults.push(result);
  saveState();
  QUIZ_SESSION.finished = true;
  QUIZ_SESSION.result = result;
  renderPage(); renderHeader();
}

  compound:['یک رفتار کوچک مثبت را انتخاب و هر روز تکرار کن.','نتیجه تجمعی آن را ماهانه اندازه بگیر.','از رهاکردن زودهنگام روند مثبت خودداری کن.'],
  gratitude:['هر روز حداقل یک مورد شکرگزاری ثبت کن.','شکرگزاری را همراه با یک اقدام واقعی انجام بده.','از انکار مشکلات با شکرگزاری اجتناب کن.']
};

        <div class="gdate">${g.date} ${g.category?'· '+esc(g.category):''} ${g.feeling?'· '+esc(g.feeling):''}</div>
        <div>${esc(g.text)}</div>
      </div>`).join('') || `<div class="empty-state">${t('no_data')}</div>`}
  </div>
  `;
}
function addGratitude(){
  const text = document.getElementById('f_gtext').value.trim(); if(!text) return;
  const category = document.getElementById('f_gcat2').value;
  const feeling = document.getElementById('f_gfeel').value;
  STATE.gratitude.push({id:uid(), text, category, feeling, date:todayISO()});
  saveState(); showToast(t('save_success')); renderPage();
}

function settingsWeekly(){
  const qs = ['wr_q1','wr_q2','wr_q3','wr_q4','wr_q5','wr_q6','wr_q7','wr_q8','wr_q9','wr_q10'];
  return `
  <div class="card">
    <div class="sectiontitle">${t('new_review')}</div>
    ${qs.map((k,i)=>`<div class="field"><label>${localizeNum(i+1)}. ${t(k)}</label><textarea id="f_wr_${i}"></textarea></div>`).join('')}
    <button class="btn primary" onclick="saveWeeklyReview()">${t('save')}</button>
  </div>
  <div class="card">
    <div class="sectiontitle">${t('past_reviews')}</div>
    ${STATE.weeklyReviews.slice().reverse().slice(0,5).map(wr=>`
      <div class="item-row"><div class="irow-top"><div class="ititle">${wr.date}</div><div class="badge gold">${localizeNum(wr.score)}/100</div></div></div>
    `).join('') || `<div class="empty-state">${t('no_data')}</div>`}
  </div>
  `;
}
function saveWeeklyReview(){
  const answers = [];
  for(let i=0;i<10;i++){ answers.push(document.getElementById('f_wr_'+i).value); }
  const filled = answers.filter(a=>a && a.trim()).length;
  const score = Math.round((filled/10)*100);
  STATE.weeklyReviews.push({id:uid(), date:todayISO(), answers, score});
  saveState(); showToast(t('save_success')); renderPage();
}

function settingsContact(){
  return `
  <div class="card">
    <div class="field"><label>${t('name_f')}</label><input id="f_cname"></div>
    <div class="field"><label>${t('email_f')}</label><input type="email" id="f_cemail"></div>
    <div class="field"><label>${t('message_f')}</label><textarea id="f_cmsg"></textarea></div>
    <button class="btn primary" onclick="sendContact()">${t('send')}</button>
  </div>`;
}
function sendContact(){ showToast(t('message_sent')); document.getElementById('f_cname').value=''; document.getElementById('f_cemail').value=''; document.getElementById('f_cmsg').value=''; }

function settingsPrefs(){
  return `
  <div class="card">
    <div class="sectiontitle">${t('language')}</div>
    <div class="lang-pick">
      <button class="btn ${STATE.lang==='fa'?'primary':''}" onclick="setLang('fa')">فارسی</button>
      <button class="btn ${STATE.lang==='en'?'primary':''}" onclick="setLang('en')">English</button>
      <button class="btn ${STATE.lang==='ar'?'primary':''}" onclick="setLang('ar')">العربية</button>
    </div>
  </div>
  <div class="card">
    <div class="sectiontitle">${t('theme')}</div>
    <div class="lang-pick">
      <button class="btn ${STATE.theme==='dark'?'primary':''}" onclick="setTheme('dark')">${t('theme_dark')}</button>
      <button class="btn ${STATE.theme==='light'?'primary':''}" onclick="setTheme('light')">${t('theme_light')}</button>
    </div>
  </div>`;
}
function setLang(l){ STATE.lang=l; saveState(); applyLangDir(); renderNav(); renderHeader(); renderPage(); }
function setTheme(th){ STATE.theme=th; document.documentElement.setAttribute('data-theme', th); saveState(); renderPage(); }

/* ============ CHARTS ============ */
function destroyCharts(){
  Object.values(charts).forEach(c=>{ if(c) c.destroy(); });
  charts = {};
}
const CHART_COLORS = {gold:'#C9A227', green:'#3F9C6D', red:'#C0533B', blue:'#4A7FA6', grid:'rgba(154,163,168,.15)', text:'#9AA3A8'};
function chartDefaults(){
  return { plugins:{legend:{labels:{color:CHART_COLORS.text, font:{family:'Vazirmatn'}}}}, scales:{} };
}
function renderCharts(){
  destroyCharts();
  const lineEl = document.getElementById('chartLine');
  if(lineEl){
    // build last 14 days perf trend from checklist items with _date
    const labels=[]; const data=[];
    for(let i=13;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const iso = d.toISOString().slice(0,10);
      labels.push(STATE.lang==='en'? (d.getMonth()+1)+'/'+d.getDate() : faDigits((d.getMonth()+1)+'/'+d.getDate()));
      const items = allChecklistItems().filter(it=> it._date && it._date.slice(0,10)===iso);
      let pct=0;
      if(items.length){ let tw=0,dw=0; items.forEach(c=>{const w=c.score||1; tw+=w; if(c.done) dw+=w;}); pct= tw?Math.round((dw/tw)*100):0; }
      data.push(pct);
    }
    charts.line = new Chart(lineEl, {type:'line', data:{labels, datasets:[{label:t('daily'), data, borderColor:CHART_COLORS.gold, backgroundColor:'rgba(201,162,39,.15)', fill:true, tension:.35, pointRadius:2}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:CHART_COLORS.text},grid:{color:CHART_COLORS.grid}}, y:{min:0,max:100,ticks:{color:CHART_COLORS.text},grid:{color:CHART_COLORS.grid}}}}});
  }
  const donutEl = document.getElementById('chartDonut');
  if(donutEl){
    const items = allChecklistItems();
    const done = items.filter(i=>i.done).length;
    const total = items.length;
    const notdone = total-done;
    charts.donut = new Chart(donutEl, {type:'doughnut', data:{labels:[t('done'), t('notdone')], datasets:[{data:[done, notdone], backgroundColor:[CHART_COLORS.green, CHART_COLORS.red], borderWidth:0}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{color:CHART_COLORS.text}}}}});
  }
  const barEl = document.getElementById('chartBar');
  if(barEl){
    const labels=[t('challenges'), t('opportunities'), t('threats'), t('goals_title')];
    const data=[STATE.challenges.length, STATE.opportunities.length, STATE.threats.length, STATE.goals.length];
    charts.bar = new Chart(barEl, {type:'bar', data:{labels, datasets:[{data, backgroundColor:[CHART_COLORS.red, CHART_COLORS.green, CHART_COLORS.blue, CHART_COLORS.gold]}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:CHART_COLORS.text},grid:{display:false}}, y:{ticks:{color:CHART_COLORS.text},grid:{color:CHART_COLORS.grid}}}}});
  }
  const wfEl = document.getElementById('chartWaterfall');
  if(wfEl){
    const startScore = 50;
    const habitsBonus = Math.round(checklistProgress(STATE.development.flatMap(d=>d.checklist||[]))/10);
    const oppsBonus = Math.round(countActive(STATE.opportunities.filter(o=>o.status==='done'))*2 + STATE.opportunities.filter(o=>o.status==='done').length*2);
    const goalsBonus = Math.round(goalsProgressPct()/5);
    const threatsMalus = -Math.round(STATE.threats.filter(th=>riskLevelFromScore(riskScore(th))==='high'||riskLevelFromScore(riskScore(th))==='critical').length*3);
    const overdueMalus = -Math.round(allChecklistItems().filter(i=>isOverdue(i._date,i.done)).length*2);
    const steps = [
      {l:t('score_f')+' 0', v:startScore},
      {l:t('development'), v:habitsBonus},
      {l:t('opportunities'), v:oppsBonus},
      {l:t('goals_title'), v:goalsBonus},
      {l:t('threats'), v:threatsMalus},
      {l:t('filter_overdue'), v:overdueMalus}
    ];
    let running=0; const floatData=[]; const labels=[]; const colors=[];
    steps.forEach(s=>{
      const from=running; running+=s.v; labels.push(s.l);
      floatData.push([Math.min(from,running), Math.max(from,running)]);
      colors.push(s.v>=0?CHART_COLORS.green:CHART_COLORS.red);
    });
    labels.push(t('overall_score')); floatData.push([0,Math.max(0,running)]); colors.push(CHART_COLORS.gold);
    charts.waterfall = new Chart(wfEl, {type:'bar', data:{labels, datasets:[{data:floatData, backgroundColor:colors}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:CHART_COLORS.text, font:{size:9}},grid:{display:false}}, y:{ticks:{color:CHART_COLORS.text},grid:{color:CHART_COLORS.grid}}}}});
  }
}
function afterRender(){
  if(CURRENT_PAGE==='dashboard'){ renderCharts(); }
}

/* ============ INIT ============ */
function init(){
  document.documentElement.setAttribute('data-theme', STATE.theme);
  applyLangDir();
  renderNav();
  renderHeader();
  renderPage();
  setInterval(()=>{ renderHeader(); }, 60000);
  setInterval(()=>{ if(CURRENT_PAGE==='dashboard') { renderPage(); } }, 300000);
}
init();
</script>
