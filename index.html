<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>بازی من، زمین من، قوانین من</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0F1417; --surface:#171E24; --surface2:#1D262C; --border:#2A343B;
  --text:#E8E6DE; --text-dim:#9AA3A8; --text-faint:#6B767C;
  --gold:#C9A227; --gold-dim:#8F7420;
  --green:#3F9C6D; --green-dim:#2C6E4C;
  --red:#C0533B; --red-dim:#8A3B29;
  --blue:#4A7FA6;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface2:#F7F5F0; --border:#DEDAD0;
  --text:#20241F; --text-dim:#5B5F58; --text-faint:#8A8E86;
  --shadow:0 8px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Vazirmatn', sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden; transition:background .2s,color .2s;
}
body[dir="ltr"]{font-family:'Vazirmatn', sans-serif;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

/* LAYOUT */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:230px; background:var(--surface); border-inline-end:1px solid var(--border);
  display:flex; flex-direction:column; padding:20px 14px; flex-shrink:0;
  position:sticky; top:0; height:100vh;
}
#sidebar .brand{padding:10px 8px 22px; }
#sidebar .brand .t1{font-size:13px; color:var(--gold); font-weight:600; letter-spacing:.3px;}
#sidebar .brand .t2{font-size:19px; font-weight:800; margin-top:4px; line-height:1.5;}
#sidebar nav{display:flex; flex-direction:column; gap:4px; flex:1;}
.navitem{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--radius-md);
  color:var(--text-dim); font-size:14.5px; font-weight:600; border:1px solid transparent;
}
.navitem:hover{background:var(--surface2);}
.navitem.active{background:var(--surface2); color:var(--gold); border-color:var(--border);}
.navitem .ic{width:20px; text-align:center; font-size:16px;}
#sidebar .sidefoot{font-size:11.5px; color:var(--text-faint); padding:10px 8px;}

#main-col{flex:1; min-width:0; display:flex; flex-direction:column;}

/* HEADER */
#topheader{
  position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
#topheader .dateblock{display:flex; flex-direction:column; align-items:flex-start; gap:5px; flex-wrap:wrap;}
.today-message{font-size:12.5px;color:var(--text-dim);max-width:760px;margin-bottom:4px;display:flex;gap:7px;align-items:center;}
#topheader .weekdayline{font-size:13px; font-weight:700; color:var(--text); line-height:1.2;}
#topheader .datechips{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
#topheader .dchip{background:transparent; border:0; padding:0; border-radius:0;}
.action-gear{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;cursor:pointer;font-size:16px;}
.goal-tab-wrap{display:inline-flex;align-items:center;gap:4px;margin-inline-end:5px;}
.goal-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.goal-action-grid .btn{width:100%;}
.fin-check-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.fin-check-row:last-child{border-bottom:0;}
.fin-check-row input{accent-color:var(--green);}
.fin-progress{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:10px;display:block;width:100%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);}
.fin-progress>div{height:100%;min-width:0;background:var(--green);border-radius:99px;display:block;transition:width .25s ease;}
.fin-progress-label{font-size:11px;color:var(--text-dim);margin-top:4px;text-align:left;direction:ltr;}
#topheader .dchip{font-size:12.5px; color:var(--text-dim); background:var(--surface2); border:1px solid var(--border); padding:6px 10px; border-radius:999px; display:flex; gap:6px; align-items:center;}
#topheader .clock{font-weight:800; font-size:16px; color:var(--gold); font-variant-numeric: tabular-nums;}
#topheader .statusblock{display:flex; align-items:center; gap:12px;}\n@media(max-width:700px){#topheader .statusblock{gap:7px;flex-wrap:wrap;justify-content:flex-end}.ministat .v{font-size:13px}.ministat .l{font-size:9px;}}\n.fin-level-stats{line-height:1.9;}
.ministat{text-align:center;}
.ministat .v{font-weight:800; font-size:15px;}
.ministat .l{font-size:10.5px; color:var(--text-faint);}
#themeToggle{background:var(--surface2); border:1px solid var(--border); border-radius:999px; padding:7px 12px; font-size:13px; color:var(--text);}

main{flex:1; padding:18px 20px 90px; max-width:1400px; width:100%; margin:0 auto;}
@media(min-width:900px){ main{padding:22px 30px 40px;} }

/* CARDS */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow);}
.card + .card{margin-top:14px;}
.grid{display:grid; gap:14px;}
.grid.cols-2{grid-template-columns:1fr; }
.grid.cols-3{grid-template-columns:1fr;}
.grid.cols-4{grid-template-columns:repeat(2,1fr);}
@media(min-width:700px){
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
}
.summary-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:78px;}
.summary-card .sv{font-size:22px; font-weight:800; line-height:1.2; text-align:center; width:100%;}
.summary-card .sl{font-size:12px; color:var(--text-dim); margin-top:4px; text-align:center; width:100%;}
.summary-card .sicon{font-size:18px; opacity:.7; margin-bottom:6px; text-align:center; line-height:1;}
.dashboard-summary-section{margin-top:10px;}
.dashboard-summary-title{font-size:15px;font-weight:800;margin-bottom:8px;}
.dashboard-summary-section .dashboard-summary-row{margin-top:0;}
.dashboard-summary-row{display:grid;gap:10px;margin-top:10px;}
.dashboard-summary-row:first-of-type{margin-top:0;}
.summary-row-5{grid-template-columns:repeat(5,minmax(0,1fr));}
.summary-row-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.summary-row-3{grid-template-columns:repeat(3,minmax(0,1fr));}
@media(max-width:900px){
  .summary-row-5{grid-template-columns:repeat(5,minmax(0,1fr));}
  .summary-row-4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .summary-row-3{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:560px){
  .summary-row-5{grid-template-columns:repeat(5,minmax(0,1fr));}
  .summary-row-4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .summary-row-3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .summary-card{padding:9px 5px;min-width:0;}
  .summary-card .sv{font-size:16px;}
  .summary-card .sl{font-size:10px;white-space:nowrap;}
  .summary-card .sicon{font-size:15px;margin-bottom:4px;}
}


h1.pagetitle{font-size:20px; font-weight:800; margin-bottom:4px;}
.pagesub{font-size:13px; color:var(--text-dim); margin-bottom:16px;}
.sectiontitle{font-size:15px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}

/* BUTTONS */
.btn{display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13.5px; font-weight:600;}
.btn:hover{border-color:var(--gold);}
.btn.primary{background:var(--gold); border-color:var(--gold); color:#141414;}
.btn.danger{background:transparent; border-color:var(--red-dim); color:var(--red);}
.btn.ghost{background:transparent;}
.btn.sm{padding:5px 9px; font-size:12px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

/* TABS/FILTER */
.tabbar{
  display:flex; gap:2px; overflow-x:auto; overflow-y:hidden;
  padding:0 2px; margin:0 -2px 14px;
  position:sticky; top:72px; z-index:15;
  background:var(--bg); border-bottom:2px solid var(--border);
  box-shadow:0 3px 8px rgba(0,0,0,.08);
  scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none;}
.tabbtn{
  position:relative; white-space:nowrap; padding:12px 16px 11px;
  border:0; border-radius:0; background:transparent;
  font-size:13.5px; color:var(--text-dim); font-weight:700;
  flex:0 0 auto;
}
.tabbtn::after{
  content:''; position:absolute; left:14px; right:14px; bottom:-2px;
  height:3px; border-radius:3px 3px 0 0; background:transparent;
}
.tabbtn.active{background:transparent; color:var(--gold);}
.tabbtn.active::after{background:var(--gold);}
@media(max-width:899px){.tabbar{top:112px;}}
.filterrow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filterrow select, .filterrow input[type=text]{background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:var(--radius-sm); font-size:13px;}

/* LIST ITEMS */
.item-row{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:10px;}
.item-row .irow-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.item-row .ititle{font-weight:700; font-size:14.5px;}
.item-row .idesc{font-size:12.5px; color:var(--text-dim); margin-top:4px;}
.item-row .imeta{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.badge{font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text-dim);}
.badge.gold{color:var(--gold); border-color:var(--gold-dim);}
.badge.green{color:var(--green); border-color:var(--green-dim);}
.badge.red{color:var(--red); border-color:var(--red-dim);}
.item-actions{display:flex; gap:6px;}
.chk-progress{height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-top:8px;}
.chk-progress > div{height:100%; background:var(--green);}

 .checklist-mini{margin-top:10px; border-top:1px dashed var(--border); padding-top:8px;}
.cl-number{min-width:22px; width:22px; text-align:center; font-weight:700; color:var(--text-dim); flex:0 0 22px;}
.cl-item{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13px;}
.cl-item input[type=checkbox]{width:16px; height:16px; accent-color:var(--green);}
.cl-item.done .cltext{text-decoration:line-through; color:var(--text-faint);}
.cl-item .cltext{flex:1;}

/* MODAL */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
@media(min-width:700px){ .overlay{align-items:center;} }
.modal{background:var(--surface); border:1px solid var(--border); border-radius:16px 16px 0 0; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:20px; box-shadow:var(--shadow);}
@media(min-width:700px){ .modal{border-radius:16px;} }
.modal h3{font-size:16px; font-weight:800; margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
.field input, .field select, .field textarea{width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:var(--radius-sm); font-size:14px;}
.field textarea{min-height:70px; resize:vertical;}
.modal .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}
.field-row{display:flex; gap:10px;}
.field-row > .field{flex:1;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--gold-dim); color:var(--text); padding:10px 18px; border-radius:999px; font-size:13px; z-index:200; box-shadow:var(--shadow); font-weight:600;}
@media(min-width:900px){ .toast{bottom:24px;} }

.empty-state{text-align:center; padding:40px 20px; color:var(--text-faint);}
.empty-state .eicon{font-size:32px; margin-bottom:10px;}

/* BOTTOM NAV */
#bottomnav{
  position:fixed; bottom:0; inset-inline:0; background:var(--surface); border-top:1px solid var(--border);
  display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:30;
}
#bottomnav .bnitem{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; color:var(--text-faint); font-size:10.5px; font-weight:600;}
#bottomnav .bnitem.active{color:var(--gold);}
#bottomnav .bnitem .ic{font-size:19px;}

@media(min-width:900px){ #sidebar{display:flex;} #bottomnav{display:none;} }
@media(max-width:899px){ #sidebar{display:none;} main{padding-bottom:80px;} }

.chart-wrap{position:relative; height:220px;}
.chart-scroll{overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; padding-bottom:6px;}
.chart-scroll-inner{min-width:1100px; height:260px; position:relative;}
.gauge-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.gauge-wrap{height:230px;position:relative;}
.gauge-card{display:flex;flex-direction:column;justify-content:center;align-items:stretch;}
.gauge-card .gauge-wrap{width:100%;}
.goal-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.goal-tabbar-wrap{position:sticky;top:var(--topheader-height,0px);z-index:15;background:var(--bg);padding:4px 0 0;border-bottom:1px solid var(--border);margin-bottom:12px;}
.goal-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;margin:0;position:static !important;top:auto !important;z-index:auto !important;scrollbar-width:none;}
.goal-tabs::-webkit-scrollbar{display:none;}
.goal-tab{white-space:nowrap;padding:8px 12px;border:1px solid var(--border);background:var(--surface);border-radius:999px;color:var(--text-dim);font-weight:700;font-size:12.5px;}
.goal-tab.active{background:var(--gold);color:#141414;border-color:var(--gold);}
.goal-folder{border:1px dashed var(--border);border-radius:10px;padding:10px;margin:10px 0;}
.fin-level{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
.fin-level-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.fin-level.closed .fin-level-body{display:none;}
.fin-level-toggle{border:0;background:transparent;color:var(--text);cursor:pointer;font:inherit;text-align:start;display:flex;align-items:center;gap:7px;padding:0;}
.fin-check-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;}
.fin-check-row{min-width:0;}
.fin-check-title{flex:1 1 auto;min-width:0;overflow:hidden;}
.fin-check-title .badge{white-space:nowrap;display:inline-flex;align-items:center;vertical-align:middle;font-size:10px;padding:3px 6px;line-height:1.2;}
.fin-check-row > .badge,.fin-check-row > span:not(.fin-check-title):not(.fin-check-actions){white-space:nowrap;flex:0 0 auto;font-size:11px;}
.fin-check-actions{flex:0 0 auto;white-space:nowrap;}
@media(max-width:560px){.fin-check-row{gap:4px;font-size:10.5px;padding:6px 0}.fin-check-title .badge{font-size:9px;padding:2px 4px}.fin-check-row > .badge,.fin-check-row > span:not(.fin-check-title):not(.fin-check-actions){font-size:10px}.fin-check-actions .action-gear{font-size:11px;padding:3px 4px}}
@media(max-width:390px){.fin-check-row{gap:3px;font-size:9.5px}.fin-check-title .badge{font-size:8px;padding:2px 3px}.fin-check-row > .badge,.fin-check-row > span:not(.fin-check-title):not(.fin-check-actions){font-size:9px}.fin-check-actions .action-gear{font-size:10px;padding:2px 3px}}
.fin-check-row:last-child{border-bottom:0;}
.fin-check-title{flex:1;min-width:0;}
.fin-check-actions .action-gear{font-size:13px;}
.fin-add-check{margin-top:8px;}
.alloc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:9px;}
.alloc{font-size:11px;padding:6px 8px;border:1px solid var(--border);border-radius:7px;}
@media(min-width:700px){.alloc-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.gauge-grid{grid-template-columns:1fr}.chart-scroll-inner{min-width:900px}}

.progressbar-lg{height:16px; background:var(--border); border-radius:999px; overflow:hidden; margin:10px 0;}
.progressbar-lg > div{height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold));}
.financial-milestone-card{overflow:hidden}.financial-milestone{padding:8px 4px 4px}.financial-milestone-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.financial-milestone-title{font-weight:800;font-size:15px}.financial-milestone-current{font-size:12px;color:var(--text-dim)}.milestone-scroll{overflow-x:auto;overflow-y:hidden;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}.milestone-track{position:relative;min-width:900px;height:86px;direction:ltr}.milestone-line{position:absolute;left:12px;right:12px;top:20px;height:6px;background:var(--border);border-radius:999px}.milestone-fill{position:absolute;left:12px;top:20px;height:6px;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:999px}.milestone-points{direction:ltr;position:absolute;left:12px;right:12px;top:0;height:86px;display:flex;justify-content:space-between;align-items:flex-start}.milestone-point{width:30px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}.milestone-dot{width:18px;height:18px;border-radius:50%;background:var(--surface2);border:3px solid var(--border);box-sizing:border-box;position:relative;z-index:2}.milestone-point.reached .milestone-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.14)}.milestone-point.current .milestone-dot{transform:scale(1.18);box-shadow:0 0 0 4px rgba(201,162,39,.22)}.milestone-label{margin-top:8px;font-size:10px;color:var(--text-dim);white-space:nowrap;text-align:center}.milestone-point.reached .milestone-label,.milestone-point.current .milestone-label{color:var(--text);font-weight:800}.milestone-value{font-size:9px;color:var(--text-dim);margin-top:2px;white-space:nowrap}.milestone-legend{display:flex;justify-content:space-between;gap:8px;margin-top:2px;font-size:11px;color:var(--text-dim)}@media(max-width:600px){.milestone-track{min-width:820px}}


.rule-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
.rule-row .rn{width:22px; height:22px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--gold); flex-shrink:0;}

.quiz-opt{display:block; width:100%; text-align:start; padding:12px 14px; border:1px solid var(--border); background:var(--surface2); border-radius:var(--radius-md); margin-bottom:9px; font-size:14px;}
.quiz-opt.selected{border-color:var(--gold); background:rgba(201,162,39,.12);}
.quiz-opt.correct{border-color:var(--green); background:rgba(63,156,109,.14);}
.quiz-opt.wrong{border-color:var(--red); background:rgba(192,83,59,.14);}

.streakflame{color:var(--gold); font-weight:800;}
.gj-entry{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px; margin-bottom:8px;}
.gj-entry .gdate{font-size:11px; color:var(--text-faint);}

.lang-pick{display:flex; gap:8px; flex-wrap:wrap;}
.lang-pick button{flex:1; min-width:90px;}

.dailymission-item{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border);}
.dailymission-item:last-child{border-bottom:none;}
.dailymission-item .dmic{font-size:17px; width:24px; text-align:center;}
.dailymission-item .dmlabel{flex:1; font-size:13.5px; font-weight:600;}
.dailymission-item .dmlabel.done-text{text-decoration:line-through; color:var(--text-faint);}
.folder-toggle{display:flex; align-items:center; gap:6px;}
.item-row[draggable="true"]{cursor:grab;}
.item-row.drag-over{border-color:var(--gold); border-style:dashed;}

function initFinancialLevels(count=25,target=18000){
  const cats=[
    ['emergency',22.2],['online_opportunity',13.9],['housing',13.9],['marriage_home',27.8],
    ['startup_services',8.3],['skills_tools',8.3],['family_spending',5.6]
  ];
  count=Math.max(1,Math.min(100,Number(count)||25)); target=Math.max(1,Number(target)||18000);
  return Array.from({length:count},(_,i)=>{
    const ratio=count===1?1:i/(count-1);
    const threshold=Math.round(25*Math.pow(target/25,ratio)*100)/100;
    const allocations={}; cats.forEach(([k,p])=>allocations[k]=p);
    return {id:'fin_'+(i+1),level:i+1,threshold,startDate:'',deadline:'',allocations,checklist:cats.map(([k])=>({id:uid(),key:k,title:'',done:false,date:todayISO()}))};
  });
}
function normalizeFinancialLevelsConfig(){

  const old=Array.isArray(STATE.financialLevels)?STATE.financialLevels:[];
  const base=initFinancialLevels(count,target);
  base.forEach((x,i)=>{
    const prev=old[i];
    if(prev){
      x.id=prev.id||x.id; x.threshold=Number(prev.threshold)>0?Number(prev.threshold):x.threshold;
      x.startDate=prev.startDate||''; x.deadline=prev.deadline||'';
      x.allocations=prev.allocations||x.allocations;
      x.checklist=Array.isArray(prev.checklist)?prev.checklist:x.checklist;
      x.display=prev.display&&typeof prev.display==='object'?{...prev.display}:{};
      x.risk=Number.isFinite(Number(prev.risk))?Number(prev.risk):0;
    }

/* ============ DATE UTILS ============ */
function toJalali(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy;
  gy = gm > 2 ? gy + 1 : gy;
  let days = 355666 + (365 * gy) + Math.floor((gy + 8) / 4) - Math.floor((gy + 99) / 100) + Math.floor((gy + 399) / 400) + gd + g_d_m[gm - 1];
  jy = -1595 + (33 * Math.floor(days / 12053));
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let jm, jd;
  if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
  else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
  return [jy, jm, jd];
}

function formatJalali(date){

function localizeNum(n, decimals=1){

  const rounded=Math.round((num+Number.EPSILON)*Math.pow(10,d))/Math.pow(10,d);

  const ap=h>=12?(STATE.lang==='fa'?'ب.ظ':'PM'):(STATE.lang==='fa'?'ق.ظ':'AM');

function isSameDay(d1,d2){ return d1.toDateString()===d2.toDateString(); }
function isThisWeek(dateStr){ if(!dateStr) return false; const d=new Date(dateStr); const now=new Date(); const sw=startOfWeek(now); const ew=new Date(sw); ew.setDate(ew.getDate()+7); return d>=sw && d<ew; }
function isThisMonth(dateStr){ if(!dateStr) return false; const d=new Date(dateStr); const now=new Date(); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); }

  let totalW=0, doneW=0;
  items.forEach(it=>{
    const cl = getChecklist(it) || [];
    cl.forEach(c=>{
      const w = c.score||1;
      totalW+=w;
      if(c.done) doneW+=w;
    });
  });
  if(totalW===0) return 0;
  return Math.round((doneW/totalW)*100);
}
function allChecklistItems(){
  let all=[];
  STATE.challenges.forEach(c=> (c.checklist||[]).forEach(i=>all.push({...i, _date:c.followUpDate||c.createdDate})));
  STATE.opportunities.forEach(c=> (c.checklist||[]).forEach(i=>all.push({...i, _date:c.date})));
  STATE.threats.forEach(c=> (c.checklist||[]).forEach(i=>all.push({...i, _date:c.date})));
  STATE.development.forEach(c=> (c.checklist||[]).forEach(i=>all.push({...i, _date:c.date})));
  STATE.goals.forEach(g=> (g.lists||[]).forEach(l=> (l.checklist||[]).forEach(i=>all.push({...i, _date:i.date||g.deadline}))));
  return all;
}
function overallPerformanceScore(filterFn){
  const items = allChecklistItems().filter(i=> filterFn? filterFn(i): true);
  if(!items.length) return 0;
  let totalW=0, doneW=0;
  items.forEach(c=>{ const w=c.score||1; totalW+=w; if(c.done) doneW+=w; });
  return totalW? Math.round((doneW/totalW)*100):0;
}
function todayPerf(){ return overallPerformanceScore(i=> i._date && isToday(i._date)) || overallPerformanceScore(null); }
function weekPerf(){ return overallPerformanceScore(i=> i._date && isThisWeek(i._date)) || overallPerformanceScore(null); }
function monthPerf(){ return overallPerformanceScore(i=> i._date && isThisMonth(i._date)) || overallPerformanceScore(null); }
function isThisSeason(dateStr){
  if(!dateStr) return false;
  const d=new Date(dateStr), now=new Date();
  if(Number.isNaN(d.getTime())) return false;
  return d.getFullYear()===now.getFullYear() && Math.floor(d.getMonth()/3)===Math.floor(now.getMonth()/3);
}
function isThisYear(dateStr){
  if(!dateStr) return false;
  const d=new Date(dateStr), now=new Date();
  if(Number.isNaN(d.getTime())) return false;
  return d.getFullYear()===now.getFullYear();
}
function seasonPerf(){ return overallPerformanceScore(i=> i._date && isThisSeason(i._date)) || overallPerformanceScore(null); }
function yearPerf(){ return overallPerformanceScore(i=> i._date && isThisYear(i._date)) || overallPerformanceScore(null); }
function goalsProgressPct(){
  if(!STATE.goals.length) return 0;
  const pcts = STATE.goals.map(g=>goalProgress(g));
  return Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
}
function goalProgress(goal){
  let all=[];
  (goal.lists||[]).forEach(l=> all=all.concat(l.checklist||[]));
  if(!all.length) return 0;
  return checklistProgress(all);
}
function oppScore(o){
  const p=(Number(o.probability)||0)/100;
  return Math.round((p*(Number(o.benefit)||0)) - (Number(o.cost)||0) - (Number(o.risk)||0));
}
function riskScore(th){
  const p=(Number(th.probability)||0)/100;
  return Math.round(p*(Number(th.impact)||0));
}
function riskLevelFromScore(s){
  if(s>=75) return 'critical'; if(s>=50) return 'high'; if(s>=25) return 'medium'; return 'low';
}
function countActive(arr){ return arr.filter(x=>x.status!=='done' && x.status!=='canceled').length; }
function countTasksDone(){
  return allChecklistItems().filter(i=>i.done).length;
}
function lastQuizScore(){
  if(!STATE.quizResults.length) return 0;
  return STATE.quizResults[STATE.quizResults.length-1].scorePct;
}
function overallSystemScore(){
  const parts = [todayPerf(), goalsProgressPct(), lastQuizScore()];
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function gratitudeStreak(){
  if(!STATE.gratitude.length) return 0;
  const dates = [...new Set(STATE.gratitude.map(g=>g.date))].sort().reverse();
  let streak=0; let cur=new Date();
  for(let i=0;i<dates.length;i++){
    const d=new Date(dates[i]);
    const diff = Math.round((new Date(cur.toDateString())-new Date(d.toDateString()))/86400000);
    if(diff===0 || diff===1){ streak++; cur=d; } else break;
  }
  return streak;
}
function scoreLabel(pct){
  if(pct<=20) return t('need_review');
  if(pct<=40) return t('weak');
  if(pct<=60) return t('mediumres');
  if(pct<=80) return t('good');
  if(pct<=90) return t('vgood');
  return t('excellent');
}

/* ============ MODAL SYSTEM ============ */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="ovl"><div class="modal">${html}</div></div>`;
  document.getElementById('ovl').addEventListener('click', (e)=>{ if(e.target.id==='ovl') closeModal(); });
}
function confirmDelete(onYes){
  openModal(`
    <h3>${t('delete_confirm')}</h3>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn danger" id="confirmDelBtn">${t('yes_delete')}</button>
    </div>`);
  document.getElementById('confirmDelBtn').onclick = ()=>{ onYes(); closeModal(); };
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  const pct = checklistProgress(list);
  let toggleCall, addCall, deleteCallPrefix;
  if(scope==='perf'){
    toggleCall = (clId)=>`toggleChecklistItem('${ids.itemId}','${clId}')`;
    addCall = `addChecklistItem('${ids.itemId}','${containerId}')`;
    deleteCallPrefix = (clId)=>`deleteChecklistItem('${ids.itemId}','${clId}')`;

  return `<div class="item-row" ${dragAttrs}>

function findPerfItem(id){ return (STATE[PERF_TAB]||[]).find(x=>x.id===id); }
function toggleChecklistItem(itemId, clId){
  const o = findPerfItem(itemId); if(!o) return;
  const c = (o.checklist||[]).find(x=>x.id===clId); if(!c) return;
  c.done = !c.done;
  if(c.done) c.completedDate=todayISO(); else delete c.completedDate;
  updateParentStatusFromChecklist(o);
  saveState(); renderPage(); renderHeader();
}
function updateParentStatusFromChecklist(o){
  if(!o.checklist || !o.checklist.length) return;
  const pct = checklistProgress(o.checklist);
  if(pct===100) o.status='done';
  else if(pct>0) o.status='inprogress';
}
function addChecklistItem(itemId, containerId){
  const o = findPerfItem(itemId); if(!o) return;
  const input = document.getElementById(containerId+'_newitem');
  const val = input.value.trim();
  if(!val) return;
  if(!o.checklist) o.checklist=[];
  o.checklist.push({id:uid(), title:val, done:false, score:5, completedDate:null});
  saveState(); renderPage(); renderHeader();
}
function deleteChecklistItem(itemId, clId){
  const o = findPerfItem(itemId); if(!o) return;
  o.checklist = (o.checklist||[]).filter(x=>x.id!==clId);
  updateParentStatusFromChecklist(o);
  saveState(); renderPage(); renderHeader();
}
function restorePerfItem(id){
  const o = STATE[PERF_TAB].find(x=>x.id===id); if(!o) return;
  o.status = 'notdone';
  if(o.checklist) o.checklist.forEach(c=>{c.done=false;delete c.completedDate;});
  saveState(); showToast(t('save_success')); renderPage(); renderHeader();
}
let PERF_DRAG_ID = null;
function perfDragStart(e){
  PERF_DRAG_ID = e.currentTarget.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', PERF_DRAG_ID); }catch(err){}
}
function perfDragOver(e){
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function perfDragEnd(e){
  document.querySelectorAll('.item-row.drag-over').forEach(el=>el.classList.remove('drag-over'));
}
function perfDrop(e){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const targetId = e.currentTarget.dataset.id;
  const sourceId = PERF_DRAG_ID;
  if(!sourceId || sourceId===targetId) return;
  const arr = STATE[PERF_TAB];
  const fromIdx = arr.findIndex(x=>x.id===sourceId);
  const toIdx = arr.findIndex(x=>x.id===targetId);
  if(fromIdx<0||toIdx<0) return;
  const [moved] = arr.splice(fromIdx,1);
  arr.splice(toIdx,0,moved);
  saveState();
  document.getElementById('perfList').innerHTML = renderPerfList();
}
function deletePerfItem(id){
  confirmDelete(()=>{
    STATE[PERF_TAB] = STATE[PERF_TAB].filter(x=>x.id!==id);
    saveState(); showToast(t('deleted')); renderPage(); renderHeader();
  });
}

function saveItemModal(tab, id){
  const title = document.getElementById('f_title').value.trim();
  if(!title){ showToast('...'); return; }
  const desc = document.getElementById('f_desc') ? richValue('f_desc') : '';
  let obj;
  const existing = id ? STATE[tab].find(x=>x.id===id) : null;
  if(existing){ obj = existing; } else { obj = {id:uid(), status:'notdone', checklist:[], createdDate:todayISO()}; STATE[tab].push(obj); }
  obj.title = title; obj.description = desc;
  if(tab==='challenges'){
    obj.severity = document.getElementById('f_severity').value;
    obj.followUpDate = document.getElementById('f_followUpDate').value;
    obj.note = richValue('f_note');
    obj.startDate = document.getElementById('f_startDate').value;
    obj.endDate = document.getElementById('f_endDate').value;
  } else if(tab==='opportunities'){
    obj.probability = Number(document.getElementById('f_probability').value)||0;
    obj.benefit = Number(document.getElementById('f_benefit').value)||0;
    obj.cost = Number(document.getElementById('f_cost').value)||0;
    obj.risk = Number(document.getElementById('f_risk').value)||0;
    obj.date = document.getElementById('f_date').value;
    obj.score = oppScore(obj);
  } else if(tab==='threats'){
    obj.probability = Number(document.getElementById('f_probability').value)||0;
    obj.impact = Number(document.getElementById('f_impact').value)||0;
    obj.preventiveAction = document.getElementById('f_prevent').value;
    obj.date = document.getElementById('f_date').value;
    obj.riskLevel = riskLevelFromScore(riskScore(obj));
  } else {
    obj.category = document.getElementById('f_category').value;
    obj.date = document.getElementById('f_date').value;
  }
  saveState(); closeModal(); showToast(t('save_success'));
  renderPage(); renderHeader();
}

function renderFinancialLevelPage(){const cfg=STATE.financialLevelConfig||{count:25,target:18000};return `<div class="card"><div class="sectiontitle" style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><span>💰 ${t('financial_levels')}</span><button class="action-gear" onclick="openFinancialLevelsSettings()" title="تنظیمات سطوح مالی">⚙️</button></div><div class="smallnote">${t('financial_levels_sub')} · ${localizeNum(cfg.count)} سطح · سقف $${formatMoney(cfg.target)}</div><div style="margin-top:12px;">${renderFinancialLevels()}</div></div>`;}
function renderGoalWorkspace(goals){
  const folders=STATE.goalFolders.filter(f=>f.tabId===GOAL_TAB_ID);
  let html='';
  folders.forEach(f=>{const gs=goals.filter(g=>g.folderId===f.id);html+=`<div class="goal-folder" draggable="true" ondragover="goalDragOver(event)" ondrop="dropGoalToFolder(event,'${f.id}')"><div class="irow-top"><b>📁 ${esc(f.name)}</b><span><button class="action-gear" onclick="event.stopPropagation();openFolderActions('${f.id}')">⚙️</button></span></div>${gs.map(g=>renderGoalCard(g)).join('')||`<div class="smallnote">${t('empty_generic')}</div>`}</div>`});
  const loose=goals.filter(g=>!g.folderId); html+=loose.map(g=>renderGoalCard(g)).join('');

function sanitizeGoalHtml(html){const box=document.createElement('div');box.innerHTML=String(html||'');const allowed=['B','STRONG','I','EM','U','S','STRIKE','BR','P','DIV','SPAN','FONT'];box.querySelectorAll('*').forEach(el=>{if(!allowed.includes(el.tagName)){el.replaceWith(...Array.from(el.childNodes));return;}Array.from(el.attributes).forEach(a=>{const n=a.name.toLowerCase(),v=a.value;if(n==='style'){const clean=v.split(';').map(x=>x.trim()).filter(x=>/^(text-align|color|font-size)\s*:/i.test(x)&&!/[<>"']/ .test(x)).join(';');if(clean)el.setAttribute('style',clean);else el.removeAttribute('style');}else if(n==='color'&&el.tagName==='FONT'){if(!/^#[0-9a-f]{3,8}$/i.test(v)&&!/^rgba?\(/i.test(v)&&!/^hsla?\(/i.test(v))el.removeAttribute(a.name);}else{el.removeAttribute(a.name);}});});return box.innerHTML;}

function startQuizTimer(){stopQuizTimer(); if(!STATE.quizSettings.timerEnabled)return; QUIZ_TIME_LEFT=Math.max(1,Number(STATE.quizSettings.timePerQuestion)||20); QUIZ_TIMER_HANDLE=setInterval(()=>{if(!QUIZ_SESSION||QUIZ_SESSION.finished){stopQuizTimer();return;} QUIZ_TIME_LEFT--; const el=document.getElementById('quizTimerValue'); if(el)el.textContent=localizeNum(Math.max(0,QUIZ_TIME_LEFT)); if(QUIZ_TIME_LEFT<=0){stopQuizTimer(); if(STATE.quizSettings.autoSkip) skipQuizQuestion();}},1000);}
function pageQuiz(){
  if(QUIZ_SESSION&&!QUIZ_SESSION.finished)return renderQuizQuestion();
  if(QUIZ_SESSION&&QUIZ_SESSION.finished)return renderQuizResult(QUIZ_SESSION.result);
  if(QUIZ_VIEW==='list')return renderQuizList();
  if(QUIZ_VIEW==='folders')return renderQuizFolders();
  if(QUIZ_VIEW==='archive')return renderQuizArchive();
  if(QUIZ_VIEW==='exams')return renderQuizExams();
  const bank=activeQuizBank(),cats=getQuizCategories();
  return `<h1 class="pagetitle">${t('quiz_title')}</h1><div class="pagesub">${t('quiz_sub')}</div>
  <div class="card"><div class="sectiontitle">${t('category_breakdown')}</div>
    <div class="grid cols-3">${cats.map(c=>{const n=bank.filter(q=>q.category===c.id).length;return `<div class="summary-card"><div class="sicon">📌</div><div class="sv" style="font-size:14px;">${esc(c.name)}</div><div class="sl">${localizeNum(n)}</div><div class="item-actions" style="margin-top:7px;"><button class="btn sm ghost" onclick="openQuizCategoryModal('${c.id}')">✎</button><button class="btn sm ghost" onclick="moveQuizCategory('${c.id}',-1)">↑</button><button class="btn sm ghost" onclick="moveQuizCategory('${c.id}',1)">↓</button><button class="btn sm danger" onclick="deleteQuizCategory('${c.id}')">✕</button></div></div>`}).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;"><button class="btn primary" onclick="openStartQuizModal()">▶️ شروع آزمون</button><button class="btn ghost" onclick="openQuizExamModal()">➕ ایجاد آزمون</button><button class="btn ghost" onclick="QUIZ_VIEW='exams';renderPage();">📝 آزمون‌های من</button><button class="btn ghost" onclick="QUIZ_VIEW='list';renderPage();">📋 ${t('question_list')}</button><button class="btn ghost" onclick="QUIZ_VIEW='folders';renderPage();">📁 ${t('quiz_folders')}</button><button class="btn ghost" onclick="QUIZ_VIEW='archive';renderPage();">🗄️ آزمون‌های آرشیو شده</button><button class="btn ghost" onclick="openQuizSettings()">⚙️ ${t('quiz_settings')}</button></div>
  </div>
  ${STATE.quizFolders.length?`<div class="card"><div class="sectiontitle">📁 ${t('quiz_folders')}</div>${STATE.quizFolders.filter(f=>!f.archived).map(f=>`<div class="item-row"><div class="irow-top"><div><div class="ititle">📁 ${esc(f.name)}</div><div class="idesc">${localizeNum(bank.filter(q=>q.folderId===f.id).length)} ${t('quiz_title')}</div></div><div class="item-actions"><button class="btn sm ghost" onclick="openQuizFolderModal('${f.id}')">✎</button><button class="btn sm ghost" onclick="archiveQuizFolder('${f.id}')">🗄️</button><button class="btn sm danger" onclick="deleteQuizFolder('${f.id}')">✕</button></div></div></div>`).join('')}</div>`:''}
  ${STATE.quizResults.length?`<div class="card"><div class="sectiontitle">${t('quiz_result')}</div>${STATE.quizResults.slice().reverse().slice(0,8).map(r=>`<div class="item-row"><div class="irow-top"><div><div class="ititle">${r.date}</div><div class="idesc">${scoreLabel(r.scorePct)}</div></div><div style="display:flex;align-items:center;gap:8px;"><div class="badge gold">${localizeNum(r.scorePct)}%</div><button class="btn sm danger" onclick="deleteQuizResult('${r.id}')">✕</button></div></div></div>`).join('')}</div>`:''}`;
}
function renderQuizList(){const bank=activeQuizBank();return `<h1 class="pagetitle">${t('question_list')}</h1><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;"><button class="btn ghost" onclick="QUIZ_VIEW='home';renderPage();">← ${t('back')}</button><button class="btn primary" onclick="openNewQuizQuestion()">＋ سوال جدید</button><button class="btn ghost" onclick="openQuizQuestionListSettings()">⚙️ تنظیمات لیست سوالات</button></div><div class="card"><div class="sectiontitle">📋 مدیریت سوالات</div><div class="smallnote">تعداد سوالات فعال: ${localizeNum(bank.length)} · از این بخش می‌توانید سوال جدید بسازید، سوالات موجود را ویرایش یا آرشیو کنید.</div></div>${bank.map((q,idx)=>`<div class="item-row"><div class="irow-top"><div style="flex:1;"><span class="badge gold">${esc(quizCatLabel(q.category))}</span>${q.folderId?` <span class="badge">📁 ${esc(quizFolderLabel(q.folderId))}</span>`:''}<span class="badge">⭐ ${localizeNum(Number(q.points)||1)}</span><div class="ititle" style="margin-top:6px;">${localizeNum(idx+1)}. ${esc(q.question)}</div></div><div class="item-actions"><button class="btn sm ghost" onclick="editQuizQuestion('${q.id}')">✎</button><button class="btn sm ghost" onclick="archiveQuizQuestion('${q.id}')">🗄️</button></div></div></div>`).join('')||`<div class="card"><div class="smallnote">هنوز سوالی ساخته نشده است. از دکمه «سوال جدید» استفاده کنید.</div></div>`}`;}
function openNewQuizQuestion(){const cats=getQuizCategories(),folders=STATE.quizFolders.filter(f=>!f.archived),defaultCat=cats[0]?.id||'';openModal(`<h3>ساخت سوال جدید</h3><div class="field"><label>${t('title_f')}</label><textarea id="f_newqtext" placeholder="متن سوال را وارد کنید..."></textarea></div>${[0,1,2,3].map(i=>`<div class="field"><label>${t('option_f')} ${localizeNum(i+1)}</label><input id="f_newqopt${i}" placeholder="گزینه ${localizeNum(i+1)}"></div>`).join('')}<div class="field"><label>${t('correct_answer_f')}</label><select id="f_newqcorrect">${[0,1,2,3].map(i=>`<option value="${i}">${localizeNum(i+1)}</option>`).join('')}</select></div><div class="field"><label>${t('explanation_f')}</label><textarea id="f_newqexp" placeholder="توضیح پاسخ صحیح..."></textarea></div><div class="field"><label>امتیاز این پرسش</label><input type="number" id="f_newqpoints" min="0.1" max="100" step="0.1" value="${Number(STATE.quizSettings.defaultPoints)||1}"></div><div class="field"><label>${t('category_f')}</label><select id="f_newqcat">${cats.map(c=>`<option value="${c.id}" ${c.id===defaultCat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>${t('quiz_folders')}</label><select id="f_newqfolder"><option value="">—</option>${folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="saveNewQuizQuestion()">${t('save')}</button></div>`);}
function saveNewQuizQuestion(){const question=document.getElementById('f_newqtext')?.value.trim();const options=[0,1,2,3].map(i=>document.getElementById('f_newqopt'+i)?.value.trim());const explanation=document.getElementById('f_newqexp')?.value.trim()||'';const category=document.getElementById('f_newqcat')?.value||getQuizCategories()[0]?.id;const folderId=document.getElementById('f_newqfolder')?.value||null;const correct=Number(document.getElementById('f_newqcorrect')?.value);const points=Math.max(.1,Number(document.getElementById('f_newqpoints')?.value)||Number(STATE.quizSettings.defaultPoints)||1);if(!question||options.some(x=>!x)){showToast('متن سوال و هر چهار گزینه لازم است.');return;}const q={id:uid(),category,question,options,correct,explanation,folderId,archived:false,points};getQuizBank().push(q);saveState();closeModal();showToast('سوال جدید ساخته شد.');QUIZ_VIEW='list';renderPage();}
function openQuizQuestionListSettings(){const bank=getQuizBank();const active=bank.filter(q=>!q.archived).length,arch=bank.filter(q=>q.archived).length;openModal(`<h3>تنظیمات لیست سوالات</h3><div class="card" style="margin:0 0 10px"><div class="sectiontitle">وضعیت لیست</div><div class="smallnote">فعال: ${localizeNum(active)} · آرشیو: ${localizeNum(arch)}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="closeModal();openNewQuizQuestion()">＋ ساخت سوال جدید</button><button class="btn ghost" onclick="closeModal();openQuizSettings()">⚙️ تنظیمات کلی آزمون</button><button class="btn ghost" onclick="closeModal();QUIZ_VIEW='archive';renderPage()">🗄️ سوالات آرشیو شده</button></div><div class="smallnote" style="margin-top:10px">هر سوال می‌تواند حوزه، پوشه، توضیح پاسخ و امتیاز مستقل داشته باشد. برای ویرایش هر سوال از دکمه ✎ در فهرست استفاده کنید.</div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('close')}</button></div>`);}
function renderQuizArchive(){const bank=getQuizBank().filter(q=>q.archived);return `<h1 class="pagetitle">آرشیو آزمون‌ها</h1><button class="btn ghost" onclick="QUIZ_VIEW='home';renderPage();">← ${t('back')}</button><div class="card"><div class="sectiontitle">آزمون‌های آرشیو شده بر اساس حوزه</div>${renderQuizExamsArchive()}</div><div class="card"><div class="sectiontitle">پرسش‌های آرشیو شده بر اساس حوزه</div>${getQuizCategories().map(c=>{const qs=bank.filter(q=>q.category===c.id);return qs.length?`<div style="margin-bottom:14px"><b>${esc(c.name)}</b>${qs.map(q=>`<div class="item-row"><div class="irow-top"><div><div class="ititle">${esc(q.question)}</div></div><button class="btn sm ghost" onclick="restoreQuizQuestion('${q.id}')">↩️ ${t('restore_quiz')}</button></div></div>`).join('')}</div>`:''}).join('')||`<div class="smallnote">پرسش آرشیو شده‌ای نیست.</div>`}</div>`;}
function renderQuizFolders(){return `<h1 class="pagetitle">${t('quiz_folders')}</h1><button class="btn ghost" onclick="QUIZ_VIEW='home';renderPage();">← ${t('back')}</button><button class="btn primary" style="margin:10px 0;" onclick="openQuizFolderModal()">+ ${t('new_quiz_folder')}</button>${STATE.quizFolders.map(f=>`<div class="item-row"><div class="irow-top"><div><div class="ititle">📁 ${esc(f.name)} ${f.archived?'— '+t('archived'):''}</div><div class="idesc">${localizeNum(getQuizBank().filter(q=>q.folderId===f.id).length)}</div></div><div class="item-actions"><button class="btn sm ghost" onclick="openQuizFolderModal('${f.id}')">✎</button>${f.archived?`<button class="btn sm ghost" onclick="restoreQuizFolder('${f.id}')">↩️</button>`:`<button class="btn sm ghost" onclick="archiveQuizFolder('${f.id}')">🗄️</button>`}<button class="btn sm danger" onclick="deleteQuizFolder('${f.id}')">✕</button></div></div></div>`).join('')}`;}
function renderQuizExams(){
  const exams=STATE.quizExams||[];
  return `<h1 class="pagetitle">آزمون‌های من</h1><button class="btn ghost" onclick="QUIZ_VIEW='home';renderPage();">← ${t('back')}</button><button class="btn primary" style="margin:10px 0" onclick="openQuizExamModal()">+ ایجاد آزمون</button>
  ${exams.length?exams.map(e=>{const qs=e.questionIds.map(id=>getQuizBank().find(q=>q.id===id)).filter(Boolean);return `<div class="item-row"><div class="irow-top"><div><div class="ititle">📝 ${esc(e.name)}</div><div class="idesc">📁 ${esc(quizFolderLabel(e.folderId))} · ${localizeNum(qs.length)} پرسش · ${e.archived?'آرشیو شده':'فعال'}</div></div><div class="item-actions">${e.archived?`<button class="btn sm ghost" onclick="restoreQuizExam('${e.id}')">↩️</button>`:`<button class="btn sm primary" onclick="openStartQuizModal('${e.id}')">▶️</button><button class="btn sm ghost" onclick="archiveQuizExam('${e.id}')">🗄️</button>`}<button class="btn sm ghost" onclick="openQuizExamModal('${e.id}')">✎</button><button class="btn sm danger" onclick="deleteQuizExam('${e.id}')">✕</button></div></div></div>`}).join(''):`<div class="card">هنوز آزمونی ایجاد نشده است.</div>`}`;
}
function openQuizExamModal(id){
 const e=id&&(STATE.quizExams||[]).find(x=>x.id===id), bank=activeQuizBank();
 const selected=e?new Set(e.questionIds):new Set(bank.map(q=>q.id));
 openModal(`<h3>${id?'ویرایش آزمون':'ایجاد آزمون'}</h3><div class="field"><label>عنوان آزمون</label><input id="f_examname" value="${esc(e?.name||'آزمون جدید')}"></div><div class="field"><label>پوشه</label><select id="f_examfolder"><option value="">بدون پوشه</option>${STATE.quizFolders.filter(f=>!f.archived).map(f=>`<option value="${f.id}" ${e?.folderId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div class="field"><label>پرسش‌های آزمون را انتخاب کنید</label><div style="max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px;">${bank.map(q=>`<label style="display:block;padding:6px;"><input type="checkbox" class="exam-q" value="${q.id}" ${selected.has(q.id)?'checked':''}> ${esc(quizCatLabel(q.category))} — ${esc(q.question)}</label>`).join('')}</div></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="saveQuizExam('${id||''}')">${t('save')}</button></div>`);
}
function saveQuizExam(id){const name=document.getElementById('f_examname')?.value.trim();const ids=[...document.querySelectorAll('.exam-q:checked')].map(x=>x.value);if(!name||!ids.length){showToast('عنوان و حداقل یک پرسش لازم است.');return;}const folderId=document.getElementById('f_examfolder')?.value||null;if(id){const e=STATE.quizExams.find(x=>x.id===id);if(e){e.name=name;e.folderId=folderId;e.questionIds=ids;}}else STATE.quizExams.push({id:uid(),name,folderId,questionIds:ids,archived:false,createdAt:new Date().toISOString()});saveState();closeModal();QUIZ_VIEW='exams';renderPage();}
function archiveQuizExam(id){const e=STATE.quizExams.find(x=>x.id===id);if(e){e.archived=true;saveState();renderPage();}}
function restoreQuizExam(id){const e=STATE.quizExams.find(x=>x.id===id);if(e){e.archived=false;saveState();renderPage();}}
function deleteQuizExam(id){confirmDelete(()=>{STATE.quizExams=STATE.quizExams.filter(e=>e.id!==id);saveState();renderPage();});}
function openStartQuizModal(examId){
 const e=examId&&(STATE.quizExams||[]).find(x=>x.id===examId), available=e?e.questionIds.map(id=>getQuizBank().find(q=>q.id===id)).filter(Boolean):activeQuizBank();
 if(!available.length){showToast('هیچ پرسشی برای این آزمون وجود ندارد.');return;}
 const d=STATE.quizSettings;
 openModal(`<h3>شروع آزمون${e?' — '+esc(e.name):''}</h3><div class="field"><label>تعداد پرسش</label><select id="f_qcount"><option value="25">25</option><option value="50">50</option><option value="100">100</option><option value="custom">مقدار دلخواه</option></select></div><div class="field" id="customCountWrap" style="display:none"><label>تعداد دلخواه</label><input type="number" id="f_qcustom" min="1" max="${available.length}" value="${Math.min(available.length,25)}"></div><div class="field"><label><input type="checkbox" id="f_totalTimer" ${d.totalTimerEnabled?'checked':''}> زمان‌شمار معکوس کل آزمون</label></div><div class="field"><label>زمان کل (دقیقه)</label><input type="number" id="f_totalTime" min="1" max="1440" value="${d.totalTime||30}"></div><div class="field"><label>امتیاز هر پرسش</label><input type="number" id="f_points" min="0.1" max="100" step="0.1" value="${d.defaultPoints||1}"></div><div class="smallnote">این تنظیمات فقط برای همین آزمون اعمال می‌شود و تنظیمات کلی برنامه را تغییر نمی‌دهد.</div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="launchQuiz('${examId||''}')">شروع</button></div>`);
 document.getElementById('f_qcount').onchange=function(){document.getElementById('customCountWrap').style.display=this.value==='custom'?'block':'none';};
}
function launchQuiz(examId){
 const e=examId&&(STATE.quizExams||[]).find(x=>x.id===examId), base=e?e.questionIds.map(id=>getQuizBank().find(q=>q.id===id)).filter(Boolean):activeQuizBank();let mode=document.getElementById('f_qcount').value;let count=mode==='custom'?Number(document.getElementById('f_qcustom').value):Number(mode);count=Math.max(1,Math.min(count,base.length));const points=Math.max(.1,Number(document.getElementById('f_points').value)||1);const totalTimer=!!document.getElementById('f_totalTimer').checked;const totalMinutes=Math.max(1,Number(document.getElementById('f_totalTime').value)||30);const qs=base.slice().sort(()=>Math.random()-.5).slice(0,count);closeModal();startQuiz(qs,{points,totalTimer,totalSeconds:totalMinutes*60,examId:examId||null});
}
function startQuiz(questionSet,opts){const bank=questionSet||activeQuizBank();if(!bank.length)return;const o=opts||{points:1,totalTimer:false,totalSeconds:0};QUIZ_SESSION={questions:bank.slice().sort(()=>Math.random()-.5),index:0,answers:[],finished:false,selected:null,points:o.points||1,totalTimer:!!o.totalTimer,totalSeconds:o.totalSeconds||0,totalStartedAt:o.totalTimer?Date.now():null,examId:o.examId||null};startQuizTimer();startQuizTotalTimer();renderPage();}
function startQuizTotalTimer(){if(window.QUIZ_TOTAL_TIMER_HANDLE)clearInterval(window.QUIZ_TOTAL_TIMER_HANDLE);if(!QUIZ_SESSION?.totalTimer)return;window.QUIZ_TOTAL_TIMER_HANDLE=setInterval(()=>{if(!QUIZ_SESSION||QUIZ_SESSION.finished){clearInterval(window.QUIZ_TOTAL_TIMER_HANDLE);return;}const elapsed=Math.floor((Date.now()-QUIZ_SESSION.totalStartedAt)/1000);const left=Math.max(0,QUIZ_SESSION.totalSeconds-elapsed);const el=document.getElementById('quizTotalTimerValue');if(el)el.textContent=formatQuizTime(left);if(left<=0){clearInterval(window.QUIZ_TOTAL_TIMER_HANDLE);finishQuiz();}},1000);}
function formatQuizTime(sec){sec=Math.max(0,Math.floor(sec));const m=Math.floor(sec/60),s=sec%60;return `${localizeNum(String(m).padStart(2,'0'))}:${localizeNum(String(s).padStart(2,'0'))}`;}
function stopQuizTotalTimer(){if(window.QUIZ_TOTAL_TIMER_HANDLE){clearInterval(window.QUIZ_TOTAL_TIMER_HANDLE);window.QUIZ_TOTAL_TIMER_HANDLE=null;}}
function renderQuizExamsArchive(){const a=(STATE.quizExams||[]).filter(e=>e.archived);return `<h1 class="pagetitle">آزمون‌های آرشیو شده</h1>${getQuizCategories().map(c=>{const es=a.filter(e=>e.questionIds.some(id=>getQuizBank().find(q=>q.id===id)?.category===c.id));return es.length?`<div class="card"><div class="sectiontitle">${esc(c.name)}</div>${es.map(e=>`<div class="item-row"><div class="ititle">🗄️ ${esc(e.name)}</div><div class="idesc">${localizeNum(e.questionIds.length)} پرسش</div></div>`).join('')}</div>`:''}).join('')||'<div class="card">آرشیوی وجود ندارد.</div>'}`;}

function openQuizCategoryModal(id){const c=getQuizCategories().find(x=>x.id===id);if(!c)return;openModal(`<h3>${t('edit_category')}</h3><div class="field"><label>${t('section_name_f')}</label><input id="f_qcatname" value="${esc(c.name)}"></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="saveQuizCategory('${id}')">${t('save')}</button></div>`);}
function saveQuizCategory(id){const c=STATE.quizCategories.find(x=>x.id===id),n=document.getElementById('f_qcatname')?.value.trim();if(c&&n){c.name=n;saveState();closeModal();renderPage();}}
function moveQuizCategory(id,dir){const a=getQuizCategories(),i=a.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];a.forEach((x,k)=>x.order=k);STATE.quizCategories=a;saveState();renderPage();}
function deleteQuizCategory(id){const n=getQuizBank().filter(q=>q.category===id&&!q.archived).length;if(n){showToast(STATE.lang==='fa'?'ابتدا سوالات این دسته‌بندی را به دسته دیگری منتقل کنید.':'Move the questions to another category first.');return;}if(getQuizCategories().length<=1)return;confirmDelete(()=>{STATE.quizCategories=STATE.quizCategories.filter(c=>c.id!==id);saveState();renderPage();});}
function openQuizFolderModal(id){const f=id&&STATE.quizFolders.find(x=>x.id===id);openModal(`<h3>${id?t('edit_quiz_folder'):t('new_quiz_folder')}</h3><div class="field"><label>${t('list_name')}</label><input id="f_qfoldername" value="${esc(f?.name||'')}"></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="saveQuizFolder('${id||''}')">${t('save')}</button></div>`);}
function saveQuizFolder(id){const n=document.getElementById('f_qfoldername')?.value.trim();if(!n)return;if(id){const f=STATE.quizFolders.find(x=>x.id===id);if(f)f.name=n;}else STATE.quizFolders.push({id:uid(),name:n,archived:false,order:STATE.quizFolders.length});saveState();closeModal();renderPage();}
function archiveQuizFolder(id){const f=STATE.quizFolders.find(x=>x.id===id);if(f){f.archived=true;saveState();renderPage();}}
function restoreQuizFolder(id){const f=STATE.quizFolders.find(x=>x.id===id);if(f){f.archived=false;saveState();renderPage();}}
function deleteQuizFolder(id){confirmDelete(()=>{STATE.quizFolders=STATE.quizFolders.filter(f=>f.id!==id);getQuizBank().forEach(q=>{if(q.folderId===id)q.folderId=null;});saveState();renderPage();});}

function defaultThresholdChecklist(cat,th){
 const base=(SUGGESTED_CHECKLISTS[cat]||SUGGESTED_CHECKLISTS.independent||[]);
 const special={25:'شناخت پایه را کامل کن و ۵ پرسش ساده از این حوزه را دوباره حل کن.',50:'نقاط ضعف را مشخص کن و حداقل ۱۰ پرسش هدفمند از این حوزه تمرین کن.',75:'خطاهای خودت را تحلیل کن و یک آزمون کوتاه دوباره با هدف ۷۵٪ بزن.',100:'همه خطاهای قبلی را مرور کن و تا رسیدن به ۱۰۰٪ یک آزمون مجدد انجام بده.'};
 return [special[th],...base].slice(0,3);
}
function thresholdChecklist(cat,th){
 cat=cat||'independent';
 const key=String(th);
 STATE.quizThresholdChecklists=STATE.quizThresholdChecklists||{};
 STATE.quizThresholdChecklists[key]=STATE.quizThresholdChecklists[key]||{};
 if(!Array.isArray(STATE.quizThresholdChecklists[key][cat])){
   STATE.quizThresholdChecklists[key][cat]=defaultThresholdChecklist(cat,th).map(text=>({id:uid(),text}));
   saveState();
 }
 return STATE.quizThresholdChecklists[key][cat].filter(x=>x && x.text).map(x=>x.text);
}
function thresholdChecklistItems(cat,th){
 cat=cat||'independent'; const key=String(th);
 thresholdChecklist(cat,th);
 return (STATE.quizThresholdChecklists[key][cat]||[]);
}

function renderQuizResultChart(result){
  const el=document.getElementById('quizResultColumnChart');
  if(!el||typeof Chart==='undefined'){
    if(el&&typeof Chart==='undefined') setTimeout(()=>renderQuizResultChart(result),300);
    return;
  }
  const cats=getQuizCategories().filter(c=>result.byCat&&result.byCat[c.id]);
  const labels=cats.map(c=>c.name);
  const pcts=cats.map(c=>Number(result.byCat[c.id].pct)||0);
  const points=cats.map(c=>Number(result.byCat[c.id].points)||0);
  const wrap=document.getElementById('quizResultChartWrap');
  const minWidth=Math.max(520,cats.length*130);
  if(wrap) el.style.width=minWidth+'px';
  el.style.height='350px';
  if(window.quizResultChart){try{window.quizResultChart.destroy();}catch(e){}}
  const valueLabels={id:'quizResultValueLabels',afterDatasetsDraw(chart){
    const ctx=chart.ctx;
    chart.data.datasets.forEach((ds,di)=>{
      const meta=chart.getDatasetMeta(di);
      meta.data.forEach((bar,i)=>{
        const val=Number(ds.data[i])||0;
        ctx.save();ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text')||'#555';
        const txt=di===0?val+'%':val;
        ctx.fillText(txt,bar.x,bar.y-7);ctx.restore();
      });
    });
  }};
  window.quizResultChart=new Chart(el,{type:'bar',plugins:[valueLabels],data:{labels,datasets:[
    {label:'فیصدی',data:pcts,yAxisID:'yPct',backgroundColor:CHART_COLORS.gold,borderRadius:5,maxBarThickness:42},
    {label:'امتیاز',data:points,yAxisID:'yPts',backgroundColor:CHART_COLORS.green,borderRadius:5,maxBarThickness:42}
  ]},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},scales:{x:{ticks:{autoSkip:false,maxRotation:45,minRotation:0}},yPct:{min:0,max:100,position:'left',ticks:{callback:v=>v+'%'}},yPts:{min:0,position:'right',grid:{drawOnChartArea:false}}},plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:(ctx)=>ctx.dataset.label+': '+(ctx.datasetIndex===0?ctx.parsed.y+'%':ctx.parsed.y)}}}}});
}

function exportBackup(){
  try{
    // Always capture the latest state before creating the backup.
    saveState();
    const data = {
      version: 4,
      exportedAt: new Date().toISOString(),
      app: 'بازی من، زمین من، قوانین من',
      state: STATE
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backup-' + todayISO() + '.json';
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{
      try{ a.remove(); }catch(e){}
      try{ URL.revokeObjectURL(url); }catch(e){}
    }, 1500);
    showToast(STATE.lang==='fa' ? 'بکاپ با موفقیت آماده شد.' : 'Backup created successfully.');
  }catch(err){
    console.error('Backup export failed:', err);
    showToast(STATE.lang==='fa' ? 'دانلود بکاپ ناموفق بود.' : 'Backup download failed.');
  }
}
function importBackupFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const incoming = parsed && parsed.state && typeof parsed.state === 'object' ? parsed.state : parsed;
      STATE = Object.assign(defaultState(), incoming);
      normalizeState();
      saveState();
      OPEN_GOAL_ID = null; QUIZ_SESSION=null; QUIZ_VIEW='home'; PERF_ARCHIVE_VIEW=false;
      document.documentElement.setAttribute('data-theme', STATE.theme);
      applyLangDir(); renderNav(); renderHeader(); renderPage();
      showToast(t('save_success'));
    }catch(err){ showToast('Error: invalid file'); }
  };
  reader.readAsText(file);
  input.value = '';
}

function deleteHeaderMessage(id){if(STATE.headerMessages.length<=1){showToast('حداقل یک پیام نگه داشته شود');return;}STATE.headerMessages=STATE.headerMessages.filter(x=>x.id!==id);STATE.activeHeaderMessageIndex%=STATE.headerMessages.length;saveState();renderPage();renderHeader();}
function rotateHeaderMessage(){if(!STATE.headerMessages?.length)return;let next=Math.floor(Math.random()*STATE.headerMessages.length);if(STATE.headerMessages.length>1&&next===STATE.activeHeaderMessageIndex)next=(next+1)%STATE.headerMessages.length;STATE.activeHeaderMessageIndex=next;saveState();if(STATE.headerItems.message)renderHeader();}

const CHART_COLORS = {gold:'#C9A227', green:'#3F9C6D', red:'#C0533B', blue:'#4A7FA6', grid:'rgba(154,163,168,.15)', text:'#9AA3A8'};

function financialChecklistProgress(){
  const levels=Array.isArray(STATE.financialLevels)?STATE.financialLevels:[];
  if(!levels.length)return 0;
  let total=0,done=0;
  levels.forEach(x=>{const cl=Array.isArray(x.checklist)?x.checklist:[];total+=cl.length;done+=cl.filter(c=>c.done===true).length;});
  return total?Math.round(done/total*10000)/100:0;
}
function financialLevelChecklistPct(x){
  const cl=Array.isArray(x&&x.checklist)?x.checklist:[];
  return cl.length?Math.round(cl.filter(c=>c.done===true).length/cl.length*10000)/100:0;
}
function renderFinancialMilestoneBar(){
    const levels=Array.isArray(STATE.financialLevels)&&STATE.financialLevels.length?STATE.financialLevels:[];
    const target=Math.max(1,Number(STATE.financial.target)||18000), current=Math.max(0,Number(STATE.financial.current)||0);
    if(!levels.length)return '';
    let progressUnits=0, reachedCount=0, currentIndex=-1;
    levels.forEach((x,i)=>{const lp=financialLevelChecklistPct(x); progressUnits+=lp/100; if(lp>=100) reachedCount++; else if(currentIndex<0) currentIndex=i;});
    if(currentIndex<0) currentIndex=levels.length-1;
    const pct=Math.min(100,Math.max(0,progressUnits/levels.length*100));
    const points=levels.map((x,i)=>{
      const lp=financialLevelChecklistPct(x), reached=lp>=100, isCurrent=!reached&&i===currentIndex;
      return `<div class="milestone-point ${reached?'reached':''} ${isCurrent?'current':''}" title="${esc(t('level'))} ${localizeNum(x.level)} · $${formatMoney(Number(x.threshold)||0)} · ${localizeNum(lp,2)}%" onclick="navigate('goals');setTimeout(()=>toggleFinancialLevelOpen(${Number(x.level)}),0)"><span class="milestone-dot"></span><span class="milestone-label">${localizeNum(x.level)}</span><span class="milestone-value">$${formatMoney(Number(x.threshold)||0)}</span></div>`;
    }).join('');
    const assetPct=Math.min(100,Math.max(0,current/target*100));
    return `<div class="card financial-milestone-card" style="margin-top:14px"><div class="financial-milestone"><div class="financial-milestone-head"><div class="financial-milestone-title">💰 ${t('financial_levels')} · چک‌لیست</div><div class="financial-milestone-current">پیشرفت چک‌لیست: ${localizeNum(pct,2)}% · ${localizeNum(reachedCount)}/${localizeNum(levels.length)} ${t('level')}</div></div><div class="milestone-scroll"><div class="milestone-track"><div class="milestone-line"></div><div class="milestone-fill" style="width:calc(${pct}% - 12px)"></div><div class="milestone-points">${points}</div></div></div><div class="milestone-legend"><span>۰٪</span><span>سطح جاری بر اساس تکمیل چک‌لیست‌ها</span><span>۱۰۰٪</span></div><div class="smallnote" style="text-align:center;margin-top:8px;">دارایی مالی: $${formatMoney(current)} / $${formatMoney(target)} · ${localizeNum(assetPct,2)}%</div></div></div>`;
  }

function setPerfTrendMode(v){
  const allowed=['weeks-past','weeks-future','months-past','years-3'];
  PERF_TREND_MODE=allowed.includes(v)?v:'weeks-past';
  renderPage();
}
function getWeekStart(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay();
  const diff=(day+6)%7; // Monday as week start
  d.setDate(d.getDate()-diff);
  return d;
}
function performancePctForRange(start,end){
  const a=new Date(start); a.setHours(0,0,0,0);
  const b=new Date(end); b.setHours(0,0,0,0);
  const items=allChecklistItems().filter(it=>{
    if(!it._date)return false;
    const d=new Date(String(it._date).slice(0,10)+'T00:00:00');
    return !Number.isNaN(d.getTime()) && d>=a && d<b;
  });
  if(!items.length)return 0;
  let tw=0,dw=0;
  items.forEach(c=>{const w=Number(c.score)||1;tw+=w;if(c.done)dw+=w;});
  return tw?Math.round(dw/tw*100):0;
}
function weeklyPerformancePct(weekStart){
  const start=new Date(weekStart); start.setHours(0,0,0,0);
  const end=new Date(start); end.setDate(end.getDate()+7);
  return performancePctForRange(start,end);
}
function monthlyPerformancePct(monthStart){
  const start=new Date(monthStart.getFullYear(),monthStart.getMonth(),1);
  const end=new Date(start.getFullYear(),start.getMonth()+1,1);
  return performancePctForRange(start,end);
}
function renderCharts(){
  destroyCharts();
  const lineEl=document.getElementById('chartLine');
  const checklistEl=document.getElementById('chartPerfChecklist');
  if(checklistEl){
    const sections=perfSections();
    const labels=sections.map(sec=>sec.name);
    const doneData=sections.map(sec=>{
      const items=Array.isArray(STATE[sec.key])?STATE[sec.key]:[];
      return items.reduce((sum,item)=>sum+(Array.isArray(item.checklist)?item.checklist.filter(c=>c&&c.done===true).length:0),0);
    });
    const notDoneData=sections.map((sec,i)=>{
      const items=Array.isArray(STATE[sec.key])?STATE[sec.key]:[];
      const total=items.reduce((sum,item)=>sum+(Array.isArray(item.checklist)?item.checklist.length:0),0);
      return Math.max(0,total-doneData[i]);
    });
    const valuePlugin={id:'performanceChecklistValueLabels',afterDatasetsDraw(chart){
      const ctx=chart.ctx; ctx.save(); ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.font='700 11px Vazirmatn';
      ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');
      chart.data.datasets.forEach((ds,di)=>{
        const meta=chart.getDatasetMeta(di);
        meta.data.forEach((bar,i)=>{const value=Number(ds.data[i])||0; const y=Math.max(16,bar.y-6); ctx.fillText(localizeNum(value),bar.x,y);});
      });
      ctx.restore();
    }};
    charts.perfChecklist=new Chart(checklistEl,{type:'bar',plugins:[valuePlugin],data:{labels,datasets:[
      {label:'انجام‌شده',data:doneData,backgroundColor:'#3F9C6D',borderRadius:5,maxBarThickness:34},
      {label:'انجام‌نشده',data:notDoneData,backgroundColor:'#6B767C',borderRadius:5,maxBarThickness:34}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:CHART_COLORS.text,font:{family:'Vazirmatn'}}},tooltip:{callbacks:{label:(ctx)=>`${ctx.dataset.label}: ${localizeNum(ctx.parsed.y)}`}}},scales:{x:{stacked:false,ticks:{color:CHART_COLORS.text,font:{family:'Vazirmatn'}},grid:{display:false}},y:{beginAtZero:true,precision:0,ticks:{color:CHART_COLORS.text,stepSize:1},grid:{color:CHART_COLORS.grid}}}}});
  }
  if(lineEl){
    const labels=[],data=[],periods=[];
    const now=new Date(); now.setHours(0,0,0,0);
    const fmtDate=d=>STATE.lang==='en'?`${d.getMonth()+1}/${d.getDate()}`:faDigits(`${d.getMonth()+1}/${d.getDate()}`);
    const fmtMonth=d=>STATE.lang==='en'?`${d.getMonth()+1}/${String(d.getFullYear()).slice(-2)}`:faDigits(`${d.getMonth()+1}/${String(d.getFullYear()).slice(-2)}`);

    if(PERF_TREND_MODE==='weeks-past' || PERF_TREND_MODE==='weeks-future'){
      const base=getWeekStart(now);
      const direction=PERF_TREND_MODE==='weeks-future'?1:-1;
      // Always exactly 12 weekly columns.
      for(let i=0;i<12;i++){
        const ws=new Date(base); ws.setDate(ws.getDate() + direction*(PERF_TREND_MODE==='weeks-future'?i:11-i)*7);
        const end=new Date(ws); end.setDate(end.getDate()+7);
        const label=STATE.lang==='en'?`${fmtDate(ws)}–${fmtDate(new Date(end.getTime()-86400000))}`:`${fmtDate(ws)}–${fmtDate(new Date(end.getTime()-86400000))}`;
        labels.push(label);
        data.push(weeklyPerformancePct(ws));
        periods.push(ws);
      }
    } else if(PERF_TREND_MODE==='months-past'){
      const base=new Date(now.getFullYear(),now.getMonth(),1);
      // Exactly 12 monthly columns.
      for(let i=11;i>=0;i--){
        const ms=new Date(base.getFullYear(),base.getMonth()-i,1);
        labels.push(fmtMonth(ms)); data.push(monthlyPerformancePct(ms)); periods.push(ms);
      }
    } else {
      // Three years = 36 monthly columns, preserving monthly detail.
      const base=new Date(now.getFullYear(),now.getMonth(),1);
      for(let i=35;i>=0;i--){
        const ms=new Date(base.getFullYear(),base.getMonth()-i,1);
        labels.push(fmtMonth(ms)); data.push(monthlyPerformancePct(ms)); periods.push(ms);
      }
    }

    const inner=document.getElementById('perfTrendChartInner');
    if(inner){
      const count=data.length;
      inner.style.minWidth=(count<=12?'1100px':`${Math.max(1100,count*42)}px`);
      inner.style.height='300px';
    }
    const pctPlugin={id:'weeklyPctLabels',afterDatasetsDraw(chart){
      const ctx=chart.ctx; const meta=chart.getDatasetMeta(0);
      ctx.save(); ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.font='700 11px Vazirmatn';
      ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');
      meta.data.forEach((bar,i)=>{const v=data[i];ctx.fillText(`${v}%`,bar.x,bar.y-5);});
      ctx.restore();
    }};
    const isThreeYears=PERF_TREND_MODE==='years-3';
    charts.line=new Chart(lineEl,{type:'bar',plugins:[pctPlugin],data:{labels,datasets:[{label:'عملکرد',data,backgroundColor:CHART_COLORS.gold,borderRadius:5,maxBarThickness:isThreeYears?28:42}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:(ctx)=>`${ctx.parsed.y}%`}}},scales:{x:{ticks:{color:CHART_COLORS.text,maxRotation:0,autoSkip:isThreeYears},grid:{display:false}},y:{min:0,max:100,ticks:{color:CHART_COLORS.text,callback:v=>v+'%'},grid:{color:CHART_COLORS.grid}}}}});
  }
  const donutEl=document.getElementById('chartDonut');if(donutEl){const items=allChecklistItems(),done=items.filter(i=>i.done).length,total=items.length;charts.donut=new Chart(donutEl,{type:'doughnut',data:{labels:[t('done'),t('notdone')],datasets:[{data:[done,total-done],backgroundColor:[CHART_COLORS.green,CHART_COLORS.red],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:CHART_COLORS.text}}}}});}
}

function afterRender(){
  if(CURRENT_PAGE==='dashboard'){ renderCharts(); }
}

/* ============ INIT ============ */
function init(){
  document.documentElement.setAttribute('data-theme', STATE.theme);
  applyLangDir();
  renderNav();
  renderHeader();
  renderPage();
  setInterval(()=>{ renderHeader(); }, 60000);
  startHeaderMessageTimer();
  setInterval(()=>{ if(CURRENT_PAGE==='dashboard') { renderPage(); } }, 300000);
}
init();

window.addEventListener('resize', updateTopHeaderHeight);
window.addEventListener('load', updateTopHeaderHeight);
</script>
</body>
</html>
